.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}

p{margin:8px 0 12px}

.hero{background:#eaf2f2;border:1px solid #d7e4e4;border-radius:10px;padding:30px 32px;margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:21px;box-shadow:var(--shadow);margin-bottom:15px}
.module{min-height:160px;position:relative;background:#fff}
.module:nth-child(n){background:#fff}
.module .num{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;margin-bottom:13px}
.module.done{border-color:#a9c9b8}.module.done .num{background:var(--good-soft);color:var(--good)}
.btn{border:1px solid var(--accent);border-radius:6px;padding:10px 15px;font-weight:700;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-dark)}

.progress{height:6px;border-radius:99px;background:#e8ecee;overflow:hidden}
.progress>div{height:100%;background:var(--accent)}
.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.choice{border:1px solid var(--line);background:#fff;border-radius:7px;padding:13px;text-align:left;color:var(--ink)}

.choice.correct{border-color:#83b49a;background:var(--good-soft)}
.choice.wrong{border-color:#d8a0a0;background:var(--bad-soft)}
.feedback{margin-top:13px;border:1px solid var(--line);background:#f7f9f9;border-radius:7px;padding:14px}
.feedback.good{background:var(--good-soft);border-color:#c7dfd0}.feedback.warn{background:var(--warn-soft);border-color:#ead7b5}.feedback.bad{background:var(--bad-soft);border-color:#e5caca}
.quote{border-left:3px solid #8caeb0;padding:10px 14px;background:#f6f8f8;border-radius:0 6px 6px 0}
.step{display:flex;gap:10px;margin:10px 0}.circle{min-width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:800}
textarea,input,select{width:100%;padding:11px 12px;border:1px solid #cbd4d9;border-radius:6px;background:#fff;color:var(--ink);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,92,99,.11)}
textarea{min-height:135px;resize:vertical;line-height:1.7}
label{display:block;margin:10px 0 5px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:15px;align-items:center}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar label{width:185px;font-size:13px}.bar .progress{flex:1}
.tag{display:inline-block;background:#f0f3f4;border-radius:4px;padding:3px 7px;margin:3px;font-size:11px;color:#45535c}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f6f8f8}
.sort{padding:12px;border:1px solid #dfe4e8;border-radius:7px;background:white;margin:7px 0;cursor:grab}
.score{font-size:26px;font-weight:800}.hide{display:none!important}
.toast{position:fixed;right:22px;bottom:22px;background:#202a35;color:#fff;border-radius:7px;padding:11px 15px;box-shadow:0 5px 20px #0002;z-index:10}
.answer{background:#f8f7f2;border:1px solid #e4e0d4;border-radius:7px;padding:14px}.answer h3{color:#6e6045}
.check{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.checkmark{width:24px;height:24px;flex:0 0 24px;border-radius:5px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:800}
.rule{border-left:3px solid #8caeb0;padding:10px 14px;background:#f6f8f8;margin:12px 0}
.ai-item{border:1px solid var(--line);border-radius:7px;padding:14px;margin:10px 0;background:#fff}.ai-item h3{margin-bottom:7px}.ai-quote{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#f3f5f6;padding:9px 11px;border-radius:5px;white-space:pre-wrap}.ai-status{padding:12px 14px;border-radius:7px;background:var(--accent-soft);border:1px solid #d7e4e4;margin-top:12px}
.small{font-size:13px}.highlight{background:#f6edcf;padding:1px 4px;border-radius:3px}
footer{margin:28px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}

<div class="card"><h2>Kompetenzabgleich</h2><table class="table"><tr><th>RLP-Schwerpunkt</th><th>Umsetzung in Deutschlabor</th></tr>
<tr><td><b>Erklärend und argumentierend schreiben</b><br>Thesen formulieren, Argumente gewichten, Schlüsse ziehen; Gegenargumente in argumentierende Texte einbeziehen.</td><td>Argument-Labor, Argument-Battle, Ordnen, Hauptteil, Schreibwerkstatt.</td></tr>
<tr><td><b>Adressaten- und zweckgerichtet argumentieren</b></td><td>Schreibaufträge mit klarer Fragestellung und Ziel; sachliche Sprache und Leserführung.</td></tr>
<tr><td><b>Texte überarbeiten</b><br>Kriterien wie Verständlichkeit, Textsorte, Kohärenz, sprachliche Gestaltung und Richtigkeit.</td><td>Überarbeitungscoach, Checklisten, eigene Überarbeitungsschritte.</td></tr>
<tr><td><b>Digitale Schreibwerkzeuge reflektiert nutzen</b></td><td>Der Lerncoach gibt Hinweise und Fragen; er schreibt den Schülertext nicht vor.</td></tr>
<tr><td><b>Sach- und Gebrauchstexte erschließen</b><br>Behauptungen, Argumente und Belege unterscheiden.</td><td>Fehlerdetektiv, Argument-Battle und spätere materialgestützte Erweiterungen.</td></tr>
<tr><td><b>Fachsprache der Niveaustufe F</b></td><td>These, Antithese, Proargument, Kontraargument, Aufhänger, Argumentationsstruktur, Argumentationskette, Stoffsammlung.</td></tr></table></div>
<div class="card"><h2>Wichtig: lineare Erörterung ≠ vollständige Pro-und-Kontra-Erörterung</h2><p>Die bereitgestellten Unterrichtsmaterialien unterscheiden die <b>lineare (steigernde) Erörterung</b> von der dialektischen Pro-und-Kontra-Erörterung. In der linearen Erörterung wird die Fragestellung aus <b>einer Perspektive</b> entfaltet; die Argumente werden steigernd geordnet. Gegenargumente können zur Entkräftung aufgegriffen werden, sind aber nicht der Grundaufbau der Plattform.</p></div>`}

function operator(c){c.innerHTML=shell("Der Operator „erörtern“","Was die Arbeitsanweisung wirklich von dir verlangt.");
c.innerHTML+=`<div class="card"><span class="pill">MERKSATZ</span><h2>Erörtern heißt nicht: „Meine Meinung hinschreiben.“</h2><p><b>Erörtern</b> bedeutet, einen strittigen Sachverhalt bzw. eine Problemfrage <b>gedanklich zu untersuchen, Argumente zu entwickeln, zu ordnen und zu begründen</b> und daraus ein nachvollziehbares Ergebnis zu gewinnen.</p><p>Der Operator verlangt also eine <b>Argumentationsleistung</b>: Du musst zeigen, <i>warum</i> deine Position bzw. dein Ergebnis begründet ist.</p></div>
<div class="card"><h2>Die 6 Schritte des Operators</h2>${[
["1. Fragestellung klären","Was genau soll entschieden oder bewertet werden? Formuliere die Frage in eigenen Worten."],
["2. Position bestimmen","Welche Antwort vertrittst du? Bei der linearen Erörterung entscheidest du dich für eine Perspektive."],
["3. Argumente sammeln","Welche Gründe sprechen für deine Position? Nutze Stoffsammlung, Cluster oder Tabelle."],
["4. Argumente gewichten","Welche Gründe sind eher schwach, welche stark? Ordne sie sinnvoll – bei der linearen Erörterung meist steigernd."],
["5. Argumente entfalten","Jedes zentrale Argument braucht mindestens Behauptung + Begründung + Beispiel/Beleg."],
["6. Ergebnis ziehen","Formuliere am Ende klar, was sich aus deiner Argumentation ergibt."]].map(x=>`<div class="step"><div class="circle">${x[0].split(".")[0]}</div><div><b>${x[0].slice(3)}</b><div class="muted">${x[1]}</div></div></div>`).join("")}</div>
<div class="card"><h2>Was „erörtern“ in dieser Plattform konkret bedeutet</h2><div class="rule"><b>Aufgabe:</b> Erörtere, ob der öffentliche Nahverkehr für Jugendliche kostenlos sein sollte.</div><p><span class="highlight">Nicht ausreichend:</span> „Ich finde, Busse sollten kostenlos sein, weil das besser wäre.“</p><p><span class="highlight">Erörternd:</span> Du entwickelst mehrere nachvollziehbare Gründe, erklärst ihre Zusammenhänge, ordnest sie und führst sie zu einem begründeten Ergebnis.</p><p class="small muted">Hinweis: In höheren Jahrgangsstufen kann „erörtern“ je nach Aufgabenstellung ausdrücklich das Abwägen unterschiedlicher Positionen verlangen. Diese Plattform trainiert zunächst die <b>lineare Erörterung</b> nach dem vorliegenden Unterrichtsmaterial.</p></div>
<div class="card"><h2>Anforderungsbereiche</h2><table class="table"><tr><th>AB I</th><th>AB II</th><th>AB III</th></tr><tr><td>Bekanntes wiedergeben, geübte Verfahren anwenden.</td><td>Bekannte Verfahren selbstständig anwenden, ordnen, erklären und übertragen.</td><td>Komplexe Sachverhalte selbstständig bewerten, begründen und zu eigenen Lösungen gelangen.</td></tr></table><p class="small muted">Die Plattform führt von stark angeleiteten Aufgaben zu zunehmend selbstständigem Schreiben.</p></div>`}

let argOrder=[];
function argument(c){argOrder=[];c.innerHTML=shell("Argument-Labor","Ein Argument wird nicht nur behauptet, sondern entfaltet.");
c.innerHTML+=`<div class="card"><h2>Argument-Puzzle</h2><p><b>Thema:</b> Sollte der öffentliche Nahverkehr für Jugendliche kostenlos sein?</p><p>Klicke <b>Behauptung → Begründung → Beispiel</b> an.</p><div class="choicegrid">${[
["B","Kostenloser Nahverkehr könnte Jugendlichen mehr Selbstständigkeit ermöglichen."],["G","Wenn Busse und Bahnen nichts kosten, hängt eine Fahrt weniger davon ab, wie viel Geld eine Familie dafür übrig hat."],["E","So könnten Jugendliche zum Beispiel selbstständig zu einem Sportangebot oder in die Bibliothek fahren, ohne dass der Ticketpreis sie davon abhält."]
].map((x,i)=>`<button class="choice" onclick="argPick(${i},this)"><b>${x[0]}</b><br>${x[1]}</button>`).join("")}</div><div id="argF"></div></div>`}
function argPick(i,e){let ex=[0,1,2];if(i===ex[argOrder.length]){argOrder.push(i);e.classList.add("correct");if(argOrder.length===3){S.skills.argument=100;done("argument",20);document.getElementById("argF").innerHTML=`<div class="feedback good"><b>Musterlösung:</b> Behauptung → Begründung → Beispiel. Ein Beispiel macht den allgemeinen Gedanken anschaulich.</div>`;save()}}else{e.classList.add("wrong");document.getElementById("argF").innerHTML=`<div class="feedback warn">Überlege: Was ist deine Aussage? Warum gilt sie? Woran könnte man sie konkret erkennen?</div>`}}

let battleRound=0,battleScore=0;const battles=[
["Welche Begründung überzeugt stärker?","„Kostenloser Nahverkehr wäre gut, weil ich dann Geld spare.“","„Kostenloser Nahverkehr könnte Jugendlichen mehr Möglichkeiten eröffnen, weil Fahrkosten sonst darüber entscheiden können, ob sie Freunde, Sportangebote oder kulturelle Orte erreichen."],
["Welches Beispiel ist konkreter?","„Secondhand ist besser für die Umwelt.“","„Wenn eine Jacke weitergetragen statt ersetzt wird, muss für diese Person keine neue Jacke hergestellt und transportiert werden; so können Ressourcen eingespart werden."],
["Welches Argument ist am stärksten entfaltet?","„Mehr Bänke in Parks sind gut.“","„Mehr Sitzplätze und Bäume können öffentliche Plätze für unterschiedliche Menschen nutzbar machen, weil sie Erholung und Schatten bieten und Begegnungen erleichtern."]];
function battle(c){let b=battles[battleRound%3];c.innerHTML=shell("Argument-Battle","Vergleiche die Qualität von Argumenten aus unterschiedlichen Alltagsthemen.");
c.innerHTML+=`<div class="card"><span class="pill">Runde ${battleRound%3+1}/3</span><h2>${b[0]}</h2><div class="choicegrid"><button class="choice" onclick="bp(0,this)">${b[1]}</button><button class="choice" onclick="bp(1,this)">${b[2]}</button></div><div id="bf"></div></div>`}function bp(i,e){if(i===1){e.classList.add("correct");battleScore++;document.getElementById("bf").innerHTML=`<div class="feedback good">Richtig. Das zweite Argument ist konkreter bzw. besser begründet.</div>`}else{e.classList.add("wrong");document.getElementById("bf").innerHTML=`<div class="feedback warn">Achte auf die Begründung und den konkreten Nachweis. „Ich finde …“ allein macht ein Argument nicht stark.</div>`}setTimeout(()=>{battleRound++;if(battleRound%3===0){S.skills.argument=Math.max(S.skills.argument,90);done("battle",25);save();}nav("battle")},700)}

function order(c){c.innerHTML=shell("Argumente ordnen","Eine lineare Erörterung steigert die Wirkung ihrer Argumente.");
c.innerHTML+=`<div class="card"><h2>Sortier-Challenge</h2><p><b>Thema:</b> Sollte man kaputte Gegenstände häufiger reparieren statt ersetzen?</p><p>Ordne vom einfachsten zum stärksten Argument. Ziehe die Bausteine in eine sinnvolle Reihenfolge.</p><div id="sort">${[
[2,"Wenn ein Gegenstand repariert und länger genutzt wird, können Rohstoffe, Energie und Transport für einen Neukauf eingespart werden."],
[0,"Reparieren kann günstiger sein als ein neuer Kauf."],
[1,"Wer Dinge länger verwendet, produziert häufig weniger Abfall."]
].map(([i,x])=>`<div class="sort" draggable="true" data-i="${i}">${x}</div>`).join("")}</div><button class="btn" onclick="checkOrder()">Prüfen</button><div id="of"></div></div>`;setTimeout(drag,0)}
function drag(){let box=document.getElementById("sort"),d=null;box.querySelectorAll(".sort").forEach(x=>{x.ondragstart=()=>{d=x;x.classList.add("dragging")};x.ondragend=()=>x.classList.remove("dragging");x.ondragover=e=>{e.preventDefault();if(x!==d){let r=x.getBoundingClientRect();box.insertBefore(d,e.clientY<r.top+r.height/2?x:x.nextSibling)}}})}
function checkOrder(){let ids=[...document.querySelectorAll(".sort")].map(x=>x.dataset.i).join("");let f=document.getElementById("of");if(ids==="012"){S.skills.order=100;done("order",20);f.innerHTML=`<div class="feedback good"><b>Musterlösung:</b> 0 → 1 → 2. Erst kommt der direkte Kostenvorteil, dann die Abfallvermeidung und schließlich die genauere Erklärung, welche Ressourcen beim Reparieren geschont werden können.</div>`}else f.innerHTML=`<div class="feedback warn">Tipp: Steigere die Überzeugungskraft. Welches Argument erklärt am genauesten, warum die Position sinnvoll ist?</div>`;save()}

<div class="card"><h2>Selbst schreiben</h2><p>Schreibe jetzt eine eigene Einleitung zur Frage nach gebrauchter Kleidung. Nutze einen sachlichen Einstieg und formuliere die Fragestellung. <b>Nicht kopieren.</b></p><textarea id="introOwn" placeholder="Deine eigene Einleitung …"></textarea><button class="btn good" style="margin-top:10px" onclick="saveIntro()">Einleitung speichern</button><div id="iof"></div></div>`}function ip(i,e){if(i===1){e.classList.add("correct");done("intro",15);document.getElementById("if").innerHTML=`<div class="feedback good">Musterlösung: sachlicher Einstieg + Überleitung + Fragestellung.</div>`}else{e.classList.add("wrong");document.getElementById("if").innerHTML=`<div class="feedback warn">Eine gute Einleitung soll nicht schon die ganze Argumentation vorwegnehmen. Sie führt sachlich zum Thema und zur Frage.</div>`}}
function saveIntro(){let x=document.getElementById("introOwn").value.trim();let f=document.getElementById("iof");if(x.length>=40){S.writer.intro=x;S.ownAttempt=true;save();f.innerHTML=`<div class="feedback good">Gespeichert. Jetzt kannst du später mit der Musterlösung vergleichen.</div>`}else f.innerHTML=`<div class="feedback warn">Schreibe mindestens ein paar vollständige Sätze und führe erkennbar zur Fragestellung hin.</div>`}

function mainpart(c){c.innerHTML=shell("Hauptteil","Hier zeigt sich die eigentliche Argumentationsleistung.");
c.innerHTML+=`<div class="card"><h2>Das Grundmuster</h2><p><b>Thema:</b> Sollten Städte mehr kostenlose Freizeitangebote für Jugendliche schaffen?</p><div class="grid"><div class="card"><h3>1 · Behauptung</h3><p>„Kostenlose Freizeitangebote könnten mehr Jugendlichen gemeinsame Aktivitäten ermöglichen.“</p></div><div class="card"><h3>2 · Begründung</h3><p>„Nicht jede Familie kann regelmäßig Geld für Sport, Kurse oder Veranstaltungen ausgeben.“</p></div><div class="card"><h3>3 · Beispiel</h3><p>„Ein kostenloser offener Sportnachmittag könnte auch Jugendlichen offenstehen, die sich einen Vereinsbeitrag nicht leisten können.“</p></div></div></div>
<div class="card"><h2>Eigener Absatz</h2><p>Formuliere selbst einen Argumentationsabsatz zum Thema <b>„Sollten Städte mehr kostenlose Freizeitangebote für Jugendliche schaffen?“</b>. Nutze Behauptung, Begründung und Beispiel.</p><textarea id="mp" placeholder="Dein eigener Argumentationsabsatz …"></textarea><button class="btn good" style="margin-top:10px" onclick="saveMain()">Speichern & prüfen</button><div id="mpf"></div></div>`}
function saveMain(){let x=document.getElementById("mp").value.trim(),f=document.getElementById("mpf");if(x.length>=80){S.writer.body=x;S.ownAttempt=true;S.skills.structure=Math.max(S.skills.structure,80);done("mainpart",20);save();f.innerHTML=`<div class="feedback good">Gut: Du hast einen eigenen Absatz geschrieben. Prüfe nun selbst: Behauptung? Warum? Beispiel?</div>`}else f.innerHTML=`<div class="feedback warn">Schreibe einen vollständigen Absatz mit einem klaren Gedanken, einer Begründung und möglichst einem Beispiel.</div>`}

function conclusion(c){c.innerHTML=shell("Schluss","Der Schluss zieht die Argumentation zusammen – er eröffnet nicht plötzlich ein neues Thema.");
c.innerHTML+=`<div class="card"><h2>Erkennen</h2><div class="choicegrid">${["„Also ja. Das war meine Erörterung.“","„Zusammenfassend sprechen gute Gründe dafür, mehr kostenlose Freizeitangebote für Jugendliche zu schaffen. Sie könnten Begegnungen ermöglichen und dafür sorgen, dass Freizeit nicht allein vom Geldbeutel der Familie abhängt.“","„Wie gesagt gibt es noch viele weitere Argumente.“"].map((x,i)=>`<button class="choice" onclick="cp(${i},this)">${x}</button>`).join("")}</div><div id="cf"></div></div>
<div class="card"><h2>Jetzt selbst schreiben</h2><p>Schreibe einen eigenen Schluss zum Thema „Sollten Städte mehr kostenlose Freizeitangebote für Jugendliche schaffen?“.</p><textarea id="co" placeholder="Dein eigener Schluss …"></textarea><button class="btn good" style="margin-top:10px" onclick="saveCon()">Speichern</button><div id="cof"></div></div>`}
function cp(i,e){if(i===1){e.classList.add("correct");done("conclusion",15);document.getElementById("cf").innerHTML=`<div class="feedback good">Musterlösung: Ergebnis bündeln und begründete Schlussfolgerung formulieren.</div>`}else{e.classList.add("wrong");document.getElementById("cf").innerHTML=`<div class="feedback warn">Der Schluss soll die Argumentation abrunden und das Ergebnis deutlich machen.</div>`}}
function saveCon(){let x=document.getElementById("co").value.trim(),f=document.getElementById("cof");if(x.length>=50){S.writer.conclusion=x;S.ownAttempt=true;save();f.innerHTML=`<div class="feedback good">Gespeichert. Du hast deinen eigenen Schluss formuliert.</div>`}else f.innerHTML=`<div class="feedback warn">Formuliere mehrere vollständige Sätze und nenne ein klares Ergebnis.</div>`}

function practice(c){
 const p=S.practice||(S.practice={task:topicPool[4].q,claim:"",reason:"",example:"",paragraph:"",revision:""});
 if(!p.type)p.type="argument";
 c.innerHTML=shell("Schreibtraining","Abwechslungsreiche Schreibaufträge: Du trainierst einzelne Bausteine, überarbeitest Texte und schreibst eine vollständige Erörterung.");
 c.innerHTML+=`<div class="hero"><h2>Was möchtest du heute üben?</h2><p>Wähle erst eine Streitfrage und dann eine Schreibaufgabe. Die Themen kommen aus Freizeit, Medien, Konsum, Umwelt, Stadtleben und Zusammenleben – nicht nur aus Schule.</p>
 <label for="ptask"><b>1 · Streitfrage</b></label><select id="ptask" onchange="practiceTask(this.value)">${topicPool.map(t=>`<option value="${escHTML(t.q)}" ${p.task===t.q?"selected":""}>${escHTML(t.group+": "+t.q)}</option>`).join("")}</select>
 <label for="practiceType"><b>2 · Schreibauftrag</b></label><select id="practiceType" onchange="practiceTypeChanged(this.value)">${[
 ["argument","Ein Argument ausarbeiten"],["intro","Eine Einleitung schreiben"],["order","Argumente steigern und ordnen"],["revision","Einen schwachen Absatz überarbeiten"],["conclusion","Einen Schluss formulieren"],["full","Eine vollständige Erörterung schreiben"]
 ].map(([v,l])=>`<option value="${v}" ${p.type===v?"selected":""}>${l}</option>`).join("")}</select>
 <p class="small muted">Deine Eingaben werden automatisch in diesem Browser gespeichert. Die Rückmeldungen sind einfache Prüfhilfen und keine KI-Bewertung.</p></div><div id="practiceTaskArea"></div>`;
 renderPracticeTask();
}
function practiceTask(v){S.practice.task=v;save();renderPracticeTask()}
function practiceTypeChanged(v){S.practice.type=v;save();renderPracticeTask()}
function practiceSet(k,v){S.practice[k]=v;save();const count=document.getElementById('count_'+k);if(count)count.textContent=v.trim().split(/\s+/).filter(Boolean).length+' Wörter';}
function practiceField(key,label,placeholder,minHeight="135px"){
 const p=S.practice||{};return `<label for="field_${key}"><b>${label}</b></label><textarea id="field_${key}" style="min-height:${minHeight}" placeholder="${placeholder}" oninput="practiceSet('${key}',this.value)">${escHTML(p[key]||"")}</textarea><div class="muted small" id="count_${key}">${String(p[key]||"").trim().split(/\s+/).filter(Boolean).length} Wörter</div>`;
}
function renderPracticeTask(){
 const p=S.practice||{};const root=document.getElementById('practiceTaskArea');if(!root)return;
 const topic=escHTML(p.task||topicPool[0].q);
 const assignment={
 argument:`<div class="card"><span class="pill">AUFGABE 1 · ARGUMENT AUFBAUEN</span><h2>Vom Grund zur überzeugenden Argumentation</h2><div class="rule"><b>Streitfrage:</b> ${topic}</div><p>Entscheide dich für eine Position. Entfalte <b>ein</b> Argument nach dem Muster Behauptung – Begründung – Beispiel. Schreibe konkret und erkläre Zusammenhänge.</p>
 ${practiceField('claim','1. Behauptung / Argument','Ein wichtiger Grund dafür/dagegen ist, dass …','105px')}
 ${practiceField('reason','2. Begründung','Das ist bedeutsam, weil …','120px')}
 ${practiceField('example','3. Beispiel oder konkrete Folge','Das zeigt sich zum Beispiel, wenn …','120px')}
 ${practiceField('paragraph','4. Zusammenhängenden Absatz schreiben','Verbinde die drei Bausteine zu einem flüssigen Absatz …','190px')}
 <div class="row" style="margin-top:12px"><button class="btn secondary" onclick="buildPracticeDraft()">Bausteine als Entwurf übernehmen</button><button class="btn" onclick="checkPractice()">Schreibcheck</button><button class="btn good" onclick="savePractice()">Zwischenstand sichern</button></div><div id="practiceFeedback"></div></div>`,
 intro:`<div class="card"><span class="pill">AUFGABE 2 · EINLEITUNG</span><h2>Neugierig machen und zur Frage führen</h2><div class="rule"><b>Streitfrage:</b> ${topic}</div><p>Schreibe eine Einleitung mit etwa 3–5 Sätzen. Führe ins Thema ein, zeige, warum die Frage relevant ist, und formuliere dann die Streitfrage. Verrate noch nicht deine gesamte Argumentation.</p>
 <div class="check"><div class="checkmark">1</div><div><b>Hinführung</b><br><span class="muted">Starte mit einer Beobachtung oder einer Situation aus dem Alltag.</span></div></div><div class="check"><div class="checkmark">2</div><div><b>Themenbezug</b><br><span class="muted">Erkläre knapp, weshalb das Thema Menschen betrifft.</span></div></div><div class="check"><div class="checkmark">3</div><div><b>Fragestellung</b><br><span class="muted">Führe zur konkreten Frage über.</span></div></div>
 ${practiceField('introDraft','Deine Einleitung','In vielen Alltagssituationen stellt sich die Frage, ob …','190px')}<button class="btn" style="margin-top:10px" onclick="checkPracticeIntro()">Einleitung prüfen</button><button class="btn good" style="margin-top:10px;margin-left:8px" onclick="savePracticeType('introDraft','Einleitung gespeichert.')">Einleitung sichern</button><div id="practiceFeedback"></div></div>`,
 order:`<div class="card"><span class="pill">AUFGABE 3 · ARGUMENTE STEIGERN</span><h2>Vom nachvollziehbaren zum stärksten Argument</h2><div class="rule"><b>Streitfrage:</b> ${topic}</div><p>Entwickle drei unterschiedliche Gründe, die zu deiner Position passen. Ordne sie anschließend vom weniger starken zum überzeugendsten Argument. Die Felder stehen schon in der Reihenfolge, die du für sinnvoll hältst.</p>
 ${practiceField('rank1','Argument 1 · eher weniger stark','Ein erster Grund ist …','105px')}
 ${practiceField('rank2','Argument 2 · stärker','Darüber hinaus …','105px')}
 ${practiceField('rank3','Argument 3 · am stärksten','Besonders überzeugend ist …','105px')}
 ${practiceField('rankWhy','Warum ist diese Reihenfolge sinnvoll?','Das stärkste Argument steht am Ende, weil …','120px')}
 <button class="btn" style="margin-top:10px" onclick="checkPracticeOrder()">Reihenfolge reflektieren</button><button class="btn good" style="margin-top:10px;margin-left:8px" onclick="savePracticeType('rankWhy','Argumente und Begründung gesichert.')">Sichern</button><div id="practiceFeedback"></div></div>`,
 revision:`<div class="card"><span class="pill">AUFGABE 4 · ÜBERARBEITEN</span><h2>Aus einer Behauptung wird ein Argument</h2><div class="rule"><b>Streitfrage:</b> ${topic}</div><p><b>Ausgangstext – absichtlich schwach:</b></p><div class="quote">„Ich finde das Thema gut. Das wäre besser. Viele Leute hätten etwas davon. Deshalb sollte man das machen.“</div><p>Überarbeite den Absatz so, dass er wirklich zur gewählten Streitfrage passt. Formuliere eine klare Behauptung, erkläre den Grund und nenne ein konkretes Beispiel oder eine Folge. Vermeide Wiederholungen und leere Formulierungen wie „das wäre besser“.</p>
 ${practiceField('revision','Deine überarbeitete Fassung','Ein überzeugenderer Absatz könnte so beginnen: …','210px')}
 ${practiceField('revisionWhy','Erkläre deine wichtigste Änderung','Ich habe den Text verbessert, indem ich …','100px')}
 <button class="btn" style="margin-top:10px" onclick="checkPracticeRevision()">Überarbeitung prüfen</button><button class="btn good" style="margin-top:10px;margin-left:8px" onclick="savePracticeType('revision','Überarbeitung gesichert.')">Sichern</button><div id="practiceFeedback"></div></div>`,
 conclusion:`<div class="card"><span class="pill">AUFGABE 5 · SCHLUSS</span><h2>Ein Ergebnis formulieren, ohne alles zu wiederholen</h2><div class="rule"><b>Streitfrage:</b> ${topic}</div><p>Schreibe einen Schluss mit 2–4 Sätzen. Greife dein Ergebnis auf, bündele den Gedanken und formuliere bei Bedarf einen Ausblick. Beginne nicht mit einem ganz neuen Hauptargument.</p>
 <div class="quote"><b>Hilfsstruktur:</b> „Insgesamt sprechen die genannten Gründe dafür, dass … . Besonders wichtig ist … . Deshalb … .“</div>
 ${practiceField('conclusionDraft','Dein Schluss','Insgesamt lässt sich festhalten, dass …','170px')}<button class="btn" style="margin-top:10px" onclick="checkPracticeConclusion()">Schluss prüfen</button><button class="btn good" style="margin-top:10px;margin-left:8px" onclick="savePracticeType('conclusionDraft','Schluss gesichert.')">Sichern</button><div id="practiceFeedback"></div></div>`,
 full:`<div class="card"><span class="pill">AUFGABE 6 · GANZER TEXT</span><h2>Eine lineare Erörterung verfassen</h2><div class="rule"><b>Aufgabenstellung:</b> Erörtere folgende Frage: ${topic}</div><p>Schreibe eine vollständige Erörterung mit Einleitung, Hauptteil und Schluss. Entwickle mindestens drei unterschiedliche Argumente, entfalte sie mit Begründungen und Beispielen und ordne sie steigernd. Trenne Einleitung, Hauptteil und Schluss durch Leerzeilen. Als Orientierung: etwa 250–400 Wörter.</p>
 <div class="grid"><div><b>Einleitung</b><p class="muted small">Thema einführen und Frage stellen.</p></div><div><b>Hauptteil</b><p class="muted small">Mindestens drei ausgearbeitete Argumente, sinnvoll gesteigert.</p></div><div><b>Schluss</b><p class="muted small">Ergebnis klar formulieren.</p></div></div>
 ${practiceField('fullText','Deine vollständige Erörterung','Einleitung …\n\nHauptteil …\n\nSchluss …','330px')}
 <div class="row" style="margin-top:10px"><button class="btn" onclick="checkPracticeFull()">Textumfang und Aufbau prüfen</button><button class="btn good" onclick="savePracticeFull()">Text sichern</button><button class="btn secondary" onclick="nav('review')">Zur Überarbeitung →</button></div><div id="practiceFeedback"></div></div>`
 };
 root.innerHTML=assignment[p.type]||assignment.argument;
}
function buildPracticeDraft(){const p=S.practice;const parts=[p.claim,p.reason,p.example].map(x=>(x||"").trim()).filter(Boolean);if(!parts.length){document.getElementById('practiceFeedback').innerHTML='<div class="feedback warn">Schreibe zuerst mindestens einen Baustein.</div>';return;}p.paragraph=parts.join(' ');save();renderPracticeTask();const f=document.getElementById('practiceFeedback');if(f)f.innerHTML='<div class="feedback">Der Entwurf wurde aus deinen eigenen Bausteinen zusammengesetzt. Verbinde die Sätze jetzt sprachlich und prüfe, ob die Begründung zum Beispiel passt.</div>';}
function practiceChecks(title,checks){const root=document.getElementById('practiceFeedback');if(!root)return;root.innerHTML='<div class="feedback"><b>'+title+'</b>'+checks.map(x=>`<div class="check"><div class="checkmark">${x[1]?'✓':'·'}</div><div><b>${x[0]}</b><div class="muted">${x[1]?'Dieses Merkmal ist erkennbar.':x[2]}</div></div></div>`).join('')+'<p class="small muted">Automatischer Schreibcheck: Er prüft einfache Textmerkmale, nicht die inhaltliche Richtigkeit oder die tatsächliche Überzeugungskraft.</p></div>';}
function checkPractice(){const p=S.practice;practiceChecks('Dein Argument-Check',[
 ['Behauptung formuliert',(p.claim||'').trim().length>=20,'Formuliere einen klaren Grund, nicht nur „Ich finde …“.'],
 ['Begründung ausgearbeitet',(p.reason||'').trim().length>=30,'Erkläre, warum der Grund für deine Position spricht.'],
 ['Beispiel konkret',(p.example||'').trim().length>=25,'Ergänze eine konkrete Situation oder eine nachvollziehbare Folge.'],
 ['Absatz mit mindestens drei Sätzen',((p.paragraph||'').match(/[.!?]+/g)||[]).length>=3,'Verbinde die Bausteine in mindestens drei vollständigen Sätzen.'],
 ['Sachliche Sprache',!(/\b(mega|voll geil|halt so|echt cool|krass)\b/i.test(p.paragraph||'')),'Ersetze sehr umgangssprachliche Wörter durch präzisere Formulierungen.']]);}
function checkPracticeIntro(){const x=(S.practice.introDraft||'').trim();practiceChecks('Einleitungs-Check',[
 ['Ausreichender Umfang',x.split(/\s+/).filter(Boolean).length>=35,'Formuliere ungefähr 3–5 vollständige Sätze.'],
 ['Thema und Frage erkennbar',/ob|sollte|sollten|frage|fraglich|diskutiert/i.test(x),'Führe klar zur Streitfrage hin.'],
 ['Keine reine Meinungsbehauptung am Anfang',!/^ich finde/i.test(x),'Beginne sachlich mit einer Beobachtung oder einem Themenbezug.'],
 ['Satzschlusszeichen vorhanden',/[.!?]/.test(x),'Prüfe, ob deine Sätze vollständig und abgeschlossen sind.']]);}
function checkPracticeOrder(){const p=S.practice;practiceChecks('Check zur Argumentsteigerung',[
 ['Drei Argumente entwickelt',[p.rank1,p.rank2,p.rank3].every(x=>(x||'').trim().length>=20),'Formuliere drei unterschiedliche Gründe.'],
 ['Argumente nicht nur wiederholt',[p.rank1,p.rank2,p.rank3].map(x=>(x||'').trim().toLowerCase()).filter(Boolean).length===new Set([p.rank1,p.rank2,p.rank3].map(x=>(x||'').trim().toLowerCase())).size,'Prüfe, ob die drei Argumente wirklich unterschiedliche Gedanken enthalten.'],
 ['Reihenfolge begründet',(p.rankWhy||'').trim().length>=40,'Erkläre, weshalb das letzte Argument besonders überzeugend ist.']]);}
function checkPracticeRevision(){const p=S.practice;practiceChecks('Überarbeitungs-Check',[
 ['Text deutlich ausgearbeitet',(p.revision||'').trim().length>=100,'Schreibe einen vollständigen Absatz statt nur einzelner Stichwörter.'],
 ['Begründungssignal vorhanden',/weil|denn|dadurch|da |deshalb|daher|denn/i.test(p.revision||''),'Mache den Zusammenhang zwischen Grund und Aussage deutlich.'],
 ['Beispiel oder Folge erkennbar',/zum beispiel|beispielsweise|etwa|wenn|etwa|dadurch|sodass|so dass/i.test(p.revision||''),'Ergänze ein Beispiel oder eine konkrete Folge.'],
 ['Weniger leere Formulierungen',!(/\b(das ist gut|das wäre besser|viele leute hätten etwas davon)\b/i.test(p.revision||'')),'Ersetze ungenaue Formulierungen durch konkrete Aussagen.'],
 ['Überarbeitung begründet',(p.revisionWhy||'').trim().length>=25,'Erkläre, was du verbessert hast und warum.']]);}
function checkPracticeConclusion(){const x=(S.practice.conclusionDraft||'').trim();practiceChecks('Schluss-Check',[
 ['Mehrere vollständige Sätze',((x.match(/[.!?]+/g)||[]).length)>=2,'Formuliere mindestens zwei vollständige Sätze.'],
 ['Ergebnis erkennbar',/insgesamt|zusammenfassend|deshalb|daher|folglich|spricht dafür|spricht dagegen|lässt sich festhalten/i.test(x),'Formuliere eine klare Schlussfolgerung.'],
 ['Kein neues Hauptargument angekündigt',!/^ein weiterer grund/i.test(x),'Bündele deine Gedanken, statt ein neues Hauptargument zu beginnen.']]);}
function checkPracticeFull(){const x=(S.practice.fullText||'').trim();const words=x.split(/\s+/).filter(Boolean).length;practiceChecks('Check deiner vollständigen Erörterung ('+words+' Wörter)',[
 ['Richtwert beim Umfang',words>=250,'Schreibe als Orientierung mindestens etwa 250 Wörter.'],
 ['Mehrere vollständige Sätze',((x.match(/[.!?]+/g)||[]).length)>=8,'Entwickle Einleitung, Hauptteil und Schluss in mehreren ganzen Sätzen.'],
 ['Gliederung erkennbar',/insgesamt|zusammenfassend|abschließend|zum schluss|letztlich/i.test(x),'Mache den Übergang zum Schluss bzw. das Ergebnis deutlich.'],
 ['Begründungen sichtbar',/weil|denn|da |deshalb|daher|dadurch/i.test(x),'Verknüpfe deine Behauptungen mit Begründungen.'],
 ['Beispiel oder Konkretisierung',/zum beispiel|beispielsweise|etwa|etwa dann|wenn/i.test(x),'Nutze mindestens ein konkretes Beispiel oder eine nachvollziehbare Folge.']]);}
function savePracticeType(key,message){const x=(S.practice[key]||'').trim();if(x.length<35){document.getElementById('practiceFeedback').innerHTML='<div class="feedback warn">Schreibe deine Antwort noch etwas ausführlicher, bevor du sie sicherst.</div>';return;}S.ownAttempt=true;S.skills.writing=Math.max(S.skills.writing,35);save();document.getElementById('practiceFeedback').innerHTML='<div class="feedback good">'+message+' Dein Text bleibt lokal in diesem Browser gespeichert.</div>';}
function savePractice(revised=false){const p=S.practice;const enough=['claim','reason','example','paragraph'].every(k=>(p[k]||'').trim());if(!enough){document.getElementById('practiceFeedback').innerHTML='<div class="feedback warn">Fülle Behauptung, Begründung, Beispiel und zusammenhängenden Absatz aus. Du kannst deinen Zwischenstand jederzeit weiterschreiben.</div>';save();return;}S.ownAttempt=true;S.skills.writing=Math.max(S.skills.writing,revised&&p.revision.trim()?65:35);save();const f=document.getElementById('practiceFeedback');if(f)f.innerHTML='<div class="feedback good"><b>Schreibtraining gespeichert.</b> Deine Eingaben bleiben auf diesem Gerät. Nutze jetzt den Schreibcheck und verbessere eine Stelle bewusst.</div>';}
function savePracticeFull(){const x=(S.practice.fullText||"").trim();const words=x.split(/\s+/).filter(Boolean).length;if(words<120){document.getElementById('practiceFeedback').innerHTML='<div class="feedback warn">Dein Text hat etwa '+words+' Wörter. Ergänze Einleitung, mindestens zwei ausgearbeitete Argumente und Schluss, bevor du ihn sicherst.</div>';return;}const parts=x.split(/\n\s*\n/).map(v=>v.trim()).filter(Boolean);S.ownAttempt=true;S.writer.topic=S.practice.task;if(parts.length>=3){S.writer.intro=parts[0];S.writer.body=parts.slice(1,-1).join("\n\n");S.writer.conclusion=parts[parts.length-1];S.writer.args=parts.slice(1,-1).slice(0,3);}else{S.writer.intro="";S.writer.body=x;S.writer.conclusion="";S.writer.args=[];}S.skills.writing=Math.max(S.skills.writing,75);save();done('practice-full',30);document.getElementById('practiceFeedback').innerHTML='<div class="feedback good"><b>Deine Erörterung ist gespeichert.</b> Überarbeite jetzt den Text anhand der Kriterien. Wenn du Leerzeilen zwischen Einleitung, Hauptteil und Schluss gesetzt hast, kann der Überarbeitungscoach diese Abschnitte getrennt prüfen. Der Wortumfang allein sagt noch nichts darüber aus, wie überzeugend argumentiert wurde.</div>';}

function writer(c){let w=S.writer;c.innerHTML=shell("Schreibwerkstatt","Hier entsteht dein eigener Text. Die Plattform darf dich unterstützen, aber nicht für dich schreiben.");
c.innerHTML+=`<div class="card"><span class="pill">SCHRITT 1</span><h2>Aufgabenstellung klären</h2><p>Wähle eine Frage aus dem Alltag und entscheide dich für eine klare Position.</p><select id="topic" onchange="writerTopicChanged(this.value)">${topicPool.map(t=>`<option value="${t.q}" ${w.topic===t.q?"selected":""}>${t.q}</option>`).join("")}</select><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="pos('dafür')">Ich bin eher dafür.</button><button class="btn secondary" onclick="pos('dagegen')">Ich bin eher dagegen.</button><span id="position" class="pill">${w.position||"Position auswählen"}</span></div></div>
<div class="card"><span class="pill">SCHRITT 2</span><h2>Stoffsammlung & Gliederung</h2><p class="muted">Notiere Stichpunkte. Sortiere danach vom schwächeren zum stärkeren Argument.</p>${w.args.map((x,i)=>`<div class="step"><div class="circle">${i+1}</div><input id="a${i}" value="${x.replaceAll('"','&quot;')}" placeholder="Argument ${i+1}"></div>`).join("")}</div>
<div class="card"><span class="pill">SCHRITT 3</span><h2>Dein vollständiger Text</h2><label><b>Einleitung</b></label><textarea id="wi" placeholder="Deine Einleitung …">${w.intro}</textarea><label><b>Hauptteil</b></label><textarea id="wb" placeholder="Deine Argumentation …">${w.body}</textarea><label><b>Schluss</b></label><textarea id="wc" placeholder="Dein Schluss …">${w.conclusion}</textarea></div>

function writerTopicChanged(v){S.writer.topic=v;save()}

function review(c){
let w=S.writer,txt=[w.intro,w.body,w.conclusion].join(" ").trim();
const words=txt?txt.split(/\s+/).filter(Boolean):[];
const bodySentences=(w.body.match(/[.!?]+/g)||[]).length;
const args=w.args.filter(x=>x.trim());
const transitions=/zunächst|außerdem|darüber hinaus|ein weiterer|schließlich|am wichtigsten|besonders überzeugend|deshalb|daher|folglich|zum schluss/i.test(w.body);
const examples=/zum beispiel|beispielsweise|etwa\b|konkret|wie etwa/i.test(w.body);
const reasons=/weil|da\b|denn|deshalb|daher|dadurch|aus diesem grund|das liegt daran/i.test(w.body);
const informal=/\b(mega|voll geil|halt so|echt cool|irgendwie|krass)\b/i.test(txt);
const introOk=w.intro.trim().length>45;
const conclusionOk=w.conclusion.trim().length>35;
const checks=[
["Aufgabenbezug",!!w.topic&&!!w.position,"Ist deine Position zur Fragestellung klar erkennbar?"],
["Einleitung",introOk,"Führt die Einleitung zum Thema und zur Fragestellung hin?"],
["Argumente",args.length>=2,"Hast du mindestens zwei unterschiedliche Argumente ausgearbeitet?"],
["Begründung",reasons,"Erklärst du, warum deine Argumente für deine Position sprechen?"],
["Beispiel oder Beleg",examples,"Veranschaulichst du mindestens ein Argument mit einem Beispiel oder Beleg?"],
["Verknüpfung",transitions,"Machst du die Reihenfolge deiner Argumente sprachlich deutlich?"],
["Sachlicher Stil",!informal,"Ist deine Sprache sachlich und für eine Erörterung geeignet?"],
["Schluss",conclusionOk,"Fasst dein Schluss die Überlegung zusammen und formuliert ein Fazit?"]
];
const result = (ok,good,need)=>ok?good:need;
let feedback=[];
if(!w.position) feedback.push({title:"Position festlegen",text:"Du hast noch keine Position ausgewählt. Entscheide, welche Antwort du auf die Fragestellung vertrittst, und prüfe, ob deine Argumente diese Position stützen."});
if(!introOk) feedback.push({title:"Einleitung ausbauen",text:"Deine Einleitung ist noch sehr kurz oder fehlt. Führe zum Thema hin und formuliere die Frage, die du im Hauptteil beantworten wirst."});
if(args.length<2) feedback.push({title:"Argumente planen",text:"In deiner Stoffsammlung sind bisher "+args.length+" Argument(e) eingetragen. Sammle weitere unterschiedliche Gründe und ordne sie vom weniger überzeugenden zum stärksten."});
if(!reasons) feedback.push({title:"Begründungen vertiefen",text:"Im Hauptteil wurden keine eindeutigen Begründungssignale wie „weil“, „denn“ oder „deshalb“ erkannt. Prüfe bei jedem Argument: Warum spricht dieser Punkt für deine Position?"});
if(!examples) feedback.push({title:"Beispiel ergänzen",text:"Ein konkretes Beispiel wurde im Hauptteil nicht eindeutig erkannt. Ergänze eine Situation, Beobachtung oder ein nachvollziehbares Beispiel, das deine Begründung stützt."});
if(!transitions) feedback.push({title:"Argumente verbinden",text:"Die Reihenfolge deiner Argumente ist sprachlich noch nicht deutlich erkennbar. Nutze passende Übergänge und mache sichtbar, welches Argument besonders stark ist."});
if(informal) feedback.push({title:"Sachlicher formulieren",text:"Dein Text enthält umgangssprachliche Wendungen. Suche nach Formulierungen, die genauer und sachlicher ausdrücken, was du meinst."});
if(!conclusionOk) feedback.push({title:"Schluss vervollständigen",text:"Dein Schluss ist noch kurz oder fehlt. Führe die wichtigsten Gedanken zusammen und formuliere ein Fazit, das zu deiner Position passt."});
if(words<120) feedback.push({title:"Textumfang prüfen",text:"Dein bisheriger Text umfasst etwa "+words+" Wörter. Prüfe anhand des Arbeitsauftrags, ob du deine Argumente ausreichend entfaltet hast."});
if(feedback.length===0) feedback.push({title:"Nächster Schritt",text:"Die grundlegenden Prüfkriterien sind anhand einfacher Textmerkmale erkennbar. Lies deinen Text jetzt noch einmal aufmerksam und prüfe, ob jede Begründung wirklich nachvollziehbar ist."});
c.innerHTML=shell("Text überprüfen","Eine erste Rückmeldung zu deinem gespeicherten Entwurf. Prüfe die Hinweise am eigenen Text und entscheide selbst, was du überarbeitest.");
c.innerHTML+=`<div class="card"><div class="between"><h2>Dein Text im Überblick</h2><span class="pill">Automatischer Textcheck</span></div><p class="muted">Diese Prüfung arbeitet mit erkennbaren Textmerkmalen. Sie ersetzt keine vollständige fachliche Bewertung und kann Inhalte missverstehen.</p><div class="grid"><div><div class="score">${words}</div><div class="muted small">Wörter im Text</div></div><div><div class="score">${args.length}/3</div><div class="muted small">geplante Argumente</div></div><div><div class="score">${bodySentences}</div><div class="muted small">Satzzeichen im Hauptteil</div></div></div></div>
<div class="card"><div class="between"><h2>Individuelles KI-Feedback</h2><span class="pill">Schreibcoach</span></div><p>Der Schreibcoach prüft deine Argumentation und bezieht sich auf konkrete Stellen in deinem Text. Er schreibt den Aufsatz nicht für dich.</p><label for="feedbackCode"><b>Zugangscode der Lehrkraft</b></label><input id="feedbackCode" type="password" autocomplete="off" placeholder="Zugangscode eingeben" maxlength="100"><p class="muted small">Der Code wird nur für diese Anfrage verwendet und nicht im Browser gespeichert. Schülertexte werden an den konfigurierten KI-Dienst gesendet, um Feedback zu erzeugen.</p><div class="row"><button class="btn" id="aiReviewButton" onclick="requestAIReview()">KI-Feedback anfordern</button><button class="btn secondary" onclick="document.getElementById('aiFeedbackResult').innerHTML='';">Feedback schließen</button></div><div id="aiFeedbackResult" aria-live="polite"></div></div>
<div class="card"><h2>Kriterien für eine lineare Erörterung</h2>${checks.map(x=>`<div class="check"><div class="checkmark">${x[1]?"✓":"·"}</div><div><b>${x[0]}</b><div class="muted">${x[1]?"Ein passendes Merkmal wurde erkannt.":"Hier lohnt sich eine genauere Prüfung: "+x[2]}</div></div></div>`).join("")}</div>
<div class="card"><h2>Individuelle Hinweise zu deinem Entwurf</h2><p>Die folgenden Hinweise werden anhand deiner gespeicherten Angaben und Formulierungen zusammengestellt.</p>${feedback.map(x=>`<div class="feedback ${x.title==="Nächster Schritt"?"good":"warn"}"><b>${x.title}</b><p>${x.text}</p></div>`).join("")}<div class="rule"><b>Deine Aufgabe:</b> Wähle zwei Hinweise aus, überarbeite deinen Text selbst und speichere die neue Fassung anschließend in der Schreibwerkstatt.</div><div class="row"><button class="btn" onclick="nav('writer')">Text überarbeiten</button><button class="btn secondary" onclick="window.print()">Feedback drucken</button></div></div>`;
}
function escHTML(x){return String(x??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
async function requestAIReview(){
 const w=S.writer; const code=document.getElementById("feedbackCode")?.value.trim(); const result=document.getElementById("aiFeedbackResult"); const btn=document.getElementById("aiReviewButton");
 const text=[w.intro,w.body,w.conclusion].filter(Boolean).join("\n\n").trim();
 if(text.length<120){result.innerHTML='<div class="feedback warn">Schreibe und speichere zuerst einen eigenen Entwurf mit Einleitung, Hauptteil und Schluss. Für eine sinnvolle Rückmeldung braucht der Coach genügend Text.</div>';return;}
 if(!code){result.innerHTML='<div class="feedback warn">Bitte gib den Zugangscode ein, den deine Lehrkraft bereitstellt.</div>';return;}
 btn.disabled=true;btn.textContent="Feedback wird erstellt …";result.innerHTML='<div class="ai-status">Dein Text wird anhand der Kriterien für eine lineare Erörterung geprüft. Das kann einen Moment dauern.</div>';
 try{
   const response=await fetch(window.AI_FEEDBACK_ENDPOINT||"/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({classCode:code,topic:w.topic,position:w.position,args:w.args||[],intro:w.intro,body:w.body,conclusion:w.conclusion})});
   const data=await response.json().catch(()=>({error:"Die Antwort des Feedback-Dienstes war nicht lesbar."}));
   if(!response.ok) throw new Error(data.error||"Das Feedback konnte nicht erstellt werden.");
   const strengths=(data.strengths||[]).map(x=>`<li>${escHTML(x)}</li>`).join("");
   const priorities=(data.priorities||[]).map((x,i)=>`<div class="ai-item"><h3>${i+1}. ${escHTML(x.title)}</h3>${x.quote?`<div class="ai-quote">Textstelle: „${escHTML(x.quote)}“</div>`:""}<p>${escHTML(x.explanation)}</p><div class="rule"><b>Dein nächster Schritt:</b> ${escHTML(x.task)}</div></div>`).join("");
   const language=(data.languageNotes||[]).map(x=>`<div class="ai-item"><div class="ai-quote">${escHTML(x.quote)}</div><p><b>Hinweis:</b> ${escHTML(x.suggestion)}</p><p class="muted small">${escHTML(x.reason)}</p></div>`).join("");
   const self=(data.selfCheck||[]).map(x=>`<div class="check"><div class="checkmark">·</div><div>${escHTML(x)}</div></div>`).join("");
   result.innerHTML=`<div class="feedback good"><b>Was dir bereits gelingt</b><ul>${strengths||"<li>Der Coach hat noch keine Stärken formuliert.</li>"}</ul></div><h3 style="margin-top:18px">Deine wichtigsten Überarbeitungsschritte</h3>${priorities||'<p>Es wurden keine konkreten Überarbeitungsschritte zurückgegeben. Lies deinen Text noch einmal anhand der Kriterien.</p>'}<h3 style="margin-top:18px">Sprache und Verständlichkeit</h3>${language||'<p class="muted">Keine einzelnen Sprachhinweise ausgewählt. Prüfe deinen Text trotzdem auf Satzbau, Zeichensetzung und Wiederholungen.</p>'}<h3 style="margin-top:18px">Zum Schluss: Prüfe selbst</h3>${self}<div class="feedback"><b>Zusammenfassung</b><p>${escHTML(data.summary||"Überarbeite deinen Text anhand der Hinweise und prüfe anschließend, ob deine Argumente nachvollziehbar begründet sind.")}</p><p class="muted small">KI-Feedback kann Fehler enthalten. Du entscheidest selbst, welche Hinweise fachlich sinnvoll sind. Der Coach vergibt keine Schulnote.</p></div>`;
 }catch(err){result.innerHTML=`<div class="feedback bad"><b>Feedback gerade nicht verfügbar</b><p>${escHTML(err.message||"Bitte versuche es später erneut.")}</p><p class="muted small">Prüfe, ob der Feedback-Dienst veröffentlicht wurde und der Zugangscode stimmt.</p></div>`;}
 finally{btn.disabled=false;btn.textContent="KI-Feedback erneut anfordern";}
}
function focus(x){S.writer.focus=x;save();document.getElementById("rf").innerHTML=`<div class="feedback good"><b>Dein Überarbeitungsschwerpunkt: ${x}</b><br>Ändere jetzt mindestens zwei Stellen in deinem eigenen Text. Begründe anschließend kurz, warum deine Änderungen ihn verbessern.</div>`}

function detective(c){c.innerHTML=shell("Fehlerdetektiv","Analysiere einen schwachen argumentativen Text.");
c.innerHTML+=`<div class="card"><h2>Text unter der Lupe</h2><div class="quote">„Ich finde, Influencer müssen Werbung nicht kennzeichnen, weil Werbung einfach nervig ist. Jeder merkt das doch. Das ist halt so. Deshalb braucht man keine Kennzeichnung.“</div><p>Wähle alle Probleme.</p><div class="choicegrid">${["Die Begründung ist zu schwach.","Der Stil ist teilweise umgangssprachlich.","Ein konkretes Beispiel fehlt.","Der Text verwendet zu viele Fachbegriffe."].map((x,i)=>`<button class="choice" onclick="det(${i},this)">${x}</button>`).join("")}</div><div id="df"></div></div>`}
let ds=new Set();function det(i,e){if([0,1,2].includes(i)){e.classList.add("correct");ds.add(i)}else e.classList.add("wrong");if(ds.size===3){S.skills.structure=100;done("detective",20);document.getElementById("df").innerHTML=`<div class="feedback good"><b>Musterlösung:</b> Begründung zu schwach; teilweise umgangssprachlich; konkretes Beispiel fehlt.</div>`;save()}}

c.innerHTML+=`<div class="card"><div class="model-lock"><h3>🔒 Erst eigener Versuch</h3><p>Schreibe zuerst selbst. Erst wenn du einen eigenen Entwurf gespeichert hast, solltest du die vollständige Musterlösung öffnen.</p>${S.ownAttempt?`<button class="btn good" onclick="showModel()">Musterlösung freischalten</button>`:`<button class="btn" onclick="nav('writer')">Jetzt eigenen Entwurf schreiben →</button>`}</div><div id="model"></div></div>`}
function showModel(){S.modelSeen=true;save();document.getElementById("model").innerHTML=`<div class="answer"><h3>Musterlösung: lineare Erörterung</h3><p><b>Aufgabe:</b> Erörtere, ob man häufiger gebrauchte Kleidung kaufen sollte statt neue.</p><h4>Einleitung</h4><p>Viele Kleidungsstücke werden nur kurze Zeit getragen, obwohl sie noch in gutem Zustand sind. Gleichzeitig spielt Kleidung für den eigenen Stil und das Wohlbefinden eine wichtige Rolle. Deshalb stellt sich die Frage, ob man häufiger gebrauchte Kleidung kaufen sollte, statt immer neue Produkte zu wählen.</p><h4>Hauptteil</h4><p><b>Ein erstes Argument dafür ist, dass gebrauchte Kleidung oft günstiger ist.</b> Wer nicht den vollen Preis eines neuen Kleidungsstücks bezahlt, kann Geld sparen oder sich auch mit einem kleinen Budget passende Kleidung suchen. <b>Zum Beispiel</b> lässt sich manchmal eine gut erhaltene Jacke gebraucht deutlich preiswerter finden als im Geschäft.</p><p><b>Ein stärkeres Argument ist, dass Kleidungsstücke länger genutzt werden.</b> Wenn eine Person Kleidung weiterträgt, muss nicht für jede Nachfrage ein weiteres Stück hergestellt werden. Das kann dazu beitragen, Abfall zu vermeiden und vorhandene Produkte besser zu nutzen.</p><p><b>Am stärksten wiegt schließlich, dass ein bewussterer Umgang mit Kleidung Ressourcen schonen kann.</b> Für neue Kleidungsstücke werden Materialien verarbeitet und Produkte transportiert. Wird gut erhaltene Kleidung weitergegeben und weitergetragen, kann sich der Bedarf an neuen Produkten verringern.</p><h4>Schluss</h4><p>Zusammenfassend sprechen mehrere Gründe dafür, häufiger gebrauchte Kleidung zu kaufen. Besonders überzeugend ist, dass dadurch vorhandene Kleidungsstücke länger genutzt werden und Ressourcen geschont werden können. Secondhand muss nicht für alle Situationen die einzige Lösung sein, sollte aber eine selbstverständliche Möglichkeit beim Kleidungskauf sein.</p><h4>Analysiere die Musterlösung</h4><p><span class="tag">Aufhänger</span><span class="tag">Fragestellung</span><span class="tag">Behauptung</span><span class="tag">Begründung</span><span class="tag">Beispiel</span><span class="tag">Steigerung</span><span class="tag">Fazit</span></p><p class="small"><b>Wichtig:</b> Die Musterlösung ist eine mögliche Lösung, keine einzige „richtige“ Formulierung. Deine eigene Argumentation kann überzeugender sein, wenn sie anders aufgebaut ist.</p></div>`}

function basicChoice(i,e){if(i===1){e.classList.add("correct");done("basics",15);document.getElementById("b1").innerHTML='<div class="feedback good">Richtig. Die Aussage nennt eine Position und begründet sie sachlich.</div>'}else{e.classList.add("wrong");document.getElementById("b1").innerHTML='<div class="feedback warn">Das ist eher eine persönliche Meinung ohne ausgearbeitete Begründung.</div>'}}
let bs=[];
function basicSeq(i,e){let order=[2,1,0];if(i===order[bs.length]){bs.push(i);e.classList.add("correct");if(bs.length===3){document.getElementById("b2").innerHTML='<div class="feedback good">Richtig: Behauptung → Begründung → Folgerung/Beispiel.</div>'}}else{e.classList.add("wrong");document.getElementById("b2").innerHTML='<div class="feedback warn">Frage dich zuerst: Was behaupte ich? Danach: Warum? Erst dann folgt die Konkretisierung.</div>'}}function basicLink(i,e){if(i===0){e.classList.add("correct");document.getElementById("b3").innerHTML='<div class="feedback good">„Deshalb“ stellt den logischen Zusammenhang her.</div>'}else{e.classList.add("wrong");document.getElementById("b3").innerHTML='<div class="feedback warn">Hier brauchst du eine Folge bzw. Schlussfolgerung.</div>'}}
function basicWrite(){let x=document.getElementById("b4").value.trim();if(x.length>=25){S.ownAttempt=true;save();document.getElementById("b4f").innerHTML='<div class="feedback good">Eigener Satz gespeichert. Wichtig: Deine Formulierung ist wichtiger als eine Musterformulierung.</div>'}else document.getElementById("b4f").innerHTML='<div class="feedback warn">Schreibe einen vollständigen eigenen Satz.</div>'}

function standard(c){
c.innerHTML=shell("Training","Selbstständig argumentieren, ordnen und eigene Absätze schreiben.");
c.innerHTML+=`<div class="card"><span class="pill">LEVEL 2 · ARGUMENTATION</span><h2>1. Welches Argument ist tragfähiger?</h2>
<p><b>Frage:</b> Sollten Familien einen festen handyfreien Abend pro Woche einführen?</p>
<div class="choicegrid"><button class="choice" onclick="std1(0,this)">„Handys nerven und ich will die einfach nicht sehen.“</button><button class="choice" onclick="std1(1,this)">„Ein handyfreier Abend könnte Gespräche stärken, weil alle bewusster zuhören und Unterbrechungen seltener werden.“</button></div><div id="s1"></div></div>
<div class="card"><span class="pill">LEVEL 2 · STOFFSAMMLUNG</span><h2>2. Aus Stichpunkten ein Argument machen</h2>
<p><b>Thema:</b> Sollte man häufiger gebrauchte Kleidung kaufen statt neue?</p><p>Stichpunkte: <span class="tag">günstigerer Preis</span><span class="tag">längere Nutzung</span><span class="tag">Ressourcen</span><span class="tag">eigener Stil</span></p>
<p>Formuliere daraus einen eigenen Argumentationsabsatz mit mindestens <b>3 Sätzen</b>.</p>
<textarea id="s2" placeholder="Dein eigener Absatz …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdWrite()">Speichern</button><div id="s2f"></div></div>
<div class="card"><span class="pill">LEVEL 2 · ORDNUNG</span><h2>3. Steigerung begründen</h2>
<p>Stelle dir vor, du hast drei Argumente dafür gesammelt, dass Städte mehr Bäume und Sitzplätze schaffen sollten. Erkläre in 2–3 eigenen Sätzen, <b>warum</b> das stärkste Argument am Ende stehen sollte.</p>
<textarea id="s3" placeholder="Deine Begründung der Reihenfolge …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdOrder()">Speichern</button><div id="s3f"></div></div>
<div class="card"><span class="pill">LEVEL 2 · EINLEITUNG</span><h2>4. Eigene Einleitung schreiben</h2>
<p>Thema: <b>Sollte man häufiger gebrauchte Kleidung kaufen statt neue?</b> Schreibe eine Einleitung mit Hinführung und Fragestellung, ohne schon alle Argumente vorwegzunehmen.</p>
<textarea id="s4" placeholder="Deine Einleitung …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdIntro()">Speichern</button><div id="s4f"></div></div>`}function std1(i,e){if(i===1){e.classList.add("correct");document.getElementById("s1").innerHTML='<div class="feedback good">Das zweite Argument ist stärker entfaltet: Es nennt nicht nur ein persönliches Bedürfnis, sondern einen nachvollziehbaren Zusammenhang.</div>'}else{e.classList.add("wrong");document.getElementById("s1").innerHTML='<div class="feedback warn">Ein überzeugendes Argument braucht mehr als eine persönliche Vorliebe.</div>'}}
function stdWrite(){let x=document.getElementById("s2").value.trim();if(x.split(/[.!?]+/).filter(Boolean).length>=3){S.ownAttempt=true;S.skills.writing=Math.max(S.skills.writing,40);save();document.getElementById("s2f").innerHTML='<div class="feedback good">Gespeichert. Prüfe jetzt: Behauptung? Begründung? Beispiel oder konkrete Folge?</div>'}else document.getElementById("s2f").innerHTML='<div class="feedback warn">Formuliere mindestens drei vollständige Sätze.</div>'}
function stdOrder(){let x=document.getElementById("s3").value.trim();if(x.length>=50){S.skills.order=Math.max(S.skills.order,70);save();document.getElementById("s3f").innerHTML='<div class="feedback good">Gut. Eine Steigerung ist überzeugend, wenn das stärkste Argument am Ende besonders deutlich wirkt.</div>'}else document.getElementById("s3f").innerHTML='<div class="feedback warn">Begründe deine Entscheidung ausführlicher.</div>'}
function stdIntro(){let x=document.getElementById("s4").value.trim();if(x.length>=60){S.writer.intro=x;S.ownAttempt=true;save();document.getElementById("s4f").innerHTML='<div class="feedback good">Einleitung gespeichert. Überarbeite sie später noch einmal mit dem Kriteriencheck.</div>'}else document.getElementById("s4f").innerHTML='<div class="feedback warn">Schreibe eine vollständige Einleitung mit erkennbarem Themenbezug und Fragestellung.</div>'}

function advanced(c){
c.innerHTML=shell("Vertiefung","Für Schülerinnen und Schüler, die bereits sicher argumentieren.");
c.innerHTML+=`<div class="card"><span class="pill">LEVEL 3 · DIFFERENZIEREN</span><h2>1. Ein Argument kritisch prüfen</h2>
<div class="quote">„Online-Spiele sollten nach längerer Nutzung eine Pause empfehlen, weil dann alle automatisch aufhören und es keine Probleme mit langen Spielzeiten mehr gäbe.“</div>
<p>Schreibe 3–5 Sätze: Was ist an diesem Argument überzeugend? Wo ist es zu pauschal? Wie könntest du es präzisieren?</p>
<textarea id="a1" placeholder="Deine Analyse …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv1()">Speichern</button><div id="a1f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · GEGENPOSITION</span><h2>2. Gegenargument aufnehmen, ohne die lineare Struktur zu verlassen</h2>
<p>Formuliere einen Satz, der ein mögliches Gegenargument kurz aufgreift und anschließend entkräftet. Thema: <b>mehr kostenlose Freizeitangebote für Jugendliche</b>.</p>
<textarea id="a2" placeholder="Dein Satz …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv2()">Speichern</button><div id="a2f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · ÜBERARBEITEN</span><h2>3. Schwache Passage verbessern</h2>
<div class="quote">„Ich finde, mehr Parks sind gut. Sie machen Spaß. Außerdem kann man da viele Sachen machen. Das ist besser als zu Hause sitzen.“</div>
<p>Überarbeite die Passage so, dass ein <b>sachlicher, klar begründeter Argumentationsabsatz</b> entsteht.</p>
<textarea id="a3" placeholder="Deine Überarbeitung …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv3()">Speichern</button><div id="a3f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · REFLEXION</span><h2>4. Was macht ein Argument stark?</h2>
<p>Formuliere deine eigene Definition in 2–4 Sätzen. Verwende mindestens drei Fachbegriffe.</p>
<textarea id="a4" placeholder="Deine Definition …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv4()">Speichern</button><div id="a4f"></div></div>`}
function adv1(){let x=document.getElementById("a1").value.trim();if(x.length>=100){document.getElementById("a1f").innerHTML='<div class="feedback good">Stark. Du prüfst nicht nur, ob du zustimmst, sondern die Qualität der Begründung.</div>'}else document.getElementById("a1f").innerHTML='<div class="feedback warn">Gehe über „ich finde gut/schlecht“ hinaus und nenne mindestens einen konkreten Schwachpunkt.</div>'}
function adv2(){let x=document.getElementById("a2").value.trim();if(x.length>=45){S.skills.argument=Math.max(S.skills.argument,90);save();document.getElementById("a2f").innerHTML='<div class="feedback good">Gut. Ein Gegenargument kann kurz aufgegriffen und anschließend entkräftet werden, ohne die lineare Grundstruktur aufzugeben.</div>'}else document.getElementById("a2f").innerHTML='<div class="feedback warn">Formuliere einen vollständigen Gegenargument-Satz plus Entkräftung.</div>'}
function adv3(){let x=document.getElementById("a3").value.trim();if(x.length>=100){S.ownAttempt=true;save();document.getElementById("a3f").innerHTML='<div class="feedback good">Überarbeitung gespeichert. Vergleiche nun: Sind deine Sätze genauer und sachlicher als die Ausgangsversion?</div>'}else document.getElementById("a3f").innerHTML='<div class="feedback warn">Baue Behauptung, Begründung und ein konkretes Beispiel bzw. eine Folge ein.</div>'}
function adv4(){let x=document.getElementById("a4").value.trim();let n=(x.match(/Behauptung|Begründung|Beispiel|Beleg|These|Argument|Schluss/g)||[]).length;if(x.length>=70&&n>=3){S.skills.argument=100;save();document.getElementById("a4f").innerHTML='<div class="feedback good">Sehr gut. Du kannst nun die Qualität von Argumenten fachsprachlich erklären.</div>'}else document.getElementById("a4f").innerHTML='<div class="feedback warn">Nutze mindestens drei Fachbegriffe und erkläre ihre Funktion.</div>'}

function transfer(c){
c.innerHTML=shell("Transfer","Neue Themen: keine fertigen Satzbausteine, keine vorgegebene Musterlösung.");
c.innerHTML+=`<div class="card"><span class="pill">LEVEL 4 · SELBSTSTÄNDIG</span><h2>Wähle ein Thema</h2>
<select id="trTopic">${topicPool.map(t=>`<option value="${t.q}">${t.q}</option>`).join("")}</select></div>
<div class="card"><h2>Deine Stoffsammlung</h2><p>Notiere mindestens <b>vier</b> unterschiedliche Gründe und markiere anschließend dein stärkstes Argument.</p>
${[1,2,3,4].map(i=>`<div class="step"><div class="circle">${i}</div><input id="tr${i}" placeholder="Argument ${i}"></div>`).join("")}
<button class="btn good" onclick="transferIdeas()">Stoffsammlung speichern</button><div id="trf"></div></div>
<div class="card"><h2>Deine lineare Mini-Erörterung</h2><p>Schreibe einen vollständigen Text zur oben ausgewählten Frage mit Einleitung, mindestens drei Argumenten und Schluss. <b>Mindestens 250 Wörter.</b> Nutze die Themenfrage als Grundlage für deinen Text.</p>
<textarea id="trText" style="min-height:260px" placeholder="Dein eigener Text …"></textarea><div class="row" style="margin-top:9px"><button class="btn good" onclick="transferSave()">Text speichern</button><button class="btn secondary" onclick="nav('review')">Mit Kriterien überarbeiten →</button></div><div id="trTextF"></div></div>
<div class="card"><h2>Selbstreflexion</h2><p>Was ist dein stärkstes Argument – und warum? Welche Stelle würdest du beim Überarbeiten zuerst verändern?</p><textarea id="trRef" placeholder="Deine Reflexion …"></textarea><button class="btn good" style="margin-top:9px" onclick="transferRef()">Reflexion speichern</button><div id="trRefF"></div></div>`}
function transferIdeas(){let a=[1,2,3,4].map(i=>document.getElementById("tr"+i).value.trim());if(a.every(x=>x)){S.skills.order=Math.max(S.skills.order,100);save();document.getElementById("trf").innerHTML='<div class="feedback good">Gespeichert. Entscheide jetzt bewusst, welches Argument am stärksten ist und warum es am Ende stehen sollte.</div>'}else document.getElementById("trf").innerHTML='<div class="feedback warn">Fülle alle vier Felder mit unterschiedlichen Gründen aus.</div>'}
function transferSave(){let x=document.getElementById("trText").value.trim();let words=x.split(/\s+/).filter(Boolean).length;if(words>=250){S.ownAttempt=true;S.writer.topic=document.getElementById("trTopic").value;S.writer.body=x;S.skills.writing=100;done("transfer",50);save();document.getElementById("trTextF").innerHTML='<div class="feedback good">Dein eigener Transfertext wurde gespeichert. Jetzt überarbeiten statt sofort eine Musterlösung zu suchen.</div>'}else document.getElementById("trTextF").innerHTML=`<div class="feedback warn">Dein Text hat etwa ${words} Wörter. Schreibe mindestens 250 Wörter, damit du eine vollständige Mini-Erörterung entwickelst.</div>`}
function transferRef(){let x=document.getElementById("trRef").value.trim();if(x.length>=80){save();document.getElementById("trRefF").innerHTML='<div class="feedback good">Reflexion gespeichert. Gute Schreibende können nicht nur schreiben, sondern ihre Entscheidungen erklären.</div>'}else document.getElementById("trRefF").innerHTML='<div class="feedback warn">Begründe deine Überlegungen ausführlicher.</div>'}


function student(c){
c.innerHTML=shell("Mein Lernstand","Dein Fortschritt bleibt auf diesem Gerät gespeichert. Nutze deinen eigenen Namen oder ein Kürzel.");
c.innerHTML+=`<div class="card"><h2>Dein Profil</h2><p class="muted">Kein Konto nötig. Verwende aus Datenschutzgründen am besten ein Kürzel.</p>
<div class="row"><input id="studentName" placeholder="Name oder Kürzel" value="${S.studentName||''}" style="max-width:320px"><button class="btn" onclick="saveStudent()">Speichern</button></div><div id="studentF"></div></div>
<div class="grid">
<div class="card"><div class="score">${S.done.length}</div><div class="muted">Lernbereiche abgeschlossen</div></div>
<div class="card"><div class="score">${S.skills.argument}%</div><div class="muted">Argumentieren</div></div>
<div class="card"><div class="score">${S.skills.writing}%</div><div class="muted">Schreiben</div></div>
<div class="card"><div class="score">${S.skills.order}%</div><div class="muted">Ordnen & Strukturieren</div></div></div>
<div class="card"><h2>Deine nächsten Schritte</h2>
<div class="check"><div class="checkmark">1</div><div><b>Eigene Argumente schreiben</b><br><span class="muted">Nutze die Schreibfelder statt sofort eine Musterlösung zu öffnen.</span></div></div>
<div class="check"><div class="checkmark">2</div><div><b>Überarbeiten</b><br><span class="muted">Verbessere mindestens eine Passage deines eigenen Textes.</span></div></div>
<div class="check"><div class="checkmark">3</div><div><b>Transfer</b><br><span class="muted">Schreibe eine Mini-Erörterung zu einem neuen Thema.</span></div></div></div>
<div class="card"><h2>Meine gespeicherten Texte</h2>
<p><b>Einleitung:</b> ${S.writer.intro? "gespeichert ✓":"noch nicht gespeichert"}</p>
<p><b>Hauptteil:</b> ${S.writer.body? "gespeichert ✓":"noch nicht gespeichert"}</p>
<p><b>Schluss:</b> ${S.writer.conclusion? "gespeichert ✓":"noch nicht gespeichert"}</p></div>`}
function saveStudent(){let n=document.getElementById("studentName").value.trim();if(!n){document.getElementById("studentF").innerHTML='<div class="feedback warn">Bitte ein Kürzel oder einen Namen eingeben.</div>';return}S.studentName=n;save();document.getElementById("studentF").innerHTML='<div class="feedback good">Profil gespeichert.</div>';updateStatus()}

function teacher(c){
c.innerHTML=shell("Lehrkraft","Einfache lokale Auswertung für die Arbeit im Unterricht.");
c.innerHTML+=`<div class="card"><h2>Klassenansicht</h2>
<p class="muted">Diese Einzeldatei kann keine Schülerdaten an einen Server senden. Deshalb zeigt die Lehrkraftansicht den Lernstand dieses Browsers. Für eine echte gemeinsame Klassenstatistik braucht die Plattform später eine Datenbank oder ein LMS.</p>
<div class="grid">
<div class="card"><div class="score">${S.done.length}/14</div><div class="muted">abgeschlossene Lernbereiche auf diesem Gerät</div></div>
<div class="card"><div class="score">${S.skills.argument}%</div><div class="muted">Argumentieren</div></div>
<div class="card"><div class="score">${S.skills.writing}%</div><div class="muted">Schreiben</div></div></div>
<h3>Schwerpunkte</h3>
<div class="bar"><label>Argumentieren</label><div class="progress"><div style="width:${S.skills.argument}%"></div></div><b>${S.skills.argument}%</b></div>
<div class="bar"><label>Schreiben</label><div class="progress"><div style="width:${S.skills.writing}%"></div></div><b>${S.skills.writing}%</b></div>
<div class="bar"><label>Ordnen</label><div class="progress"><div style="width:${S.skills.order}%"></div></div><b>${S.skills.order}%</b></div></div>
<div class="card"><h2>Für die Unterrichtssteuerung</h2>
<table class="table"><tr><th>Bereich</th><th>Wenn viele noch unsicher sind …</th><th>Wenn viele sicher sind …</th></tr>
<tr><td>Argument</td><td>Grundlagen und Argument-Labor</td><td>Herausforderung: Argumente kritisch prüfen</td></tr>
<tr><td>Aufbau</td><td>Einleitung / Hauptteil / Schluss</td><td>Transfer-Erörterung</td></tr>
<tr><td>Schreiben</td><td>Satzbausteine und geführte Aufgaben</td><td>freies Schreiben + Überarbeitung</td></tr>
<tr><td>Überarbeiten</td><td>Fehlerdetektiv</td><td>Überarbeitung einer eigenen Passage</td></tr></table></div>
<div class="card"><h2>Datenschutz-Hinweis</h2><p>Die aktuelle Version speichert Lernstand und Texte ausschließlich lokal im Browser. Es werden keine Schülerdaten an mich oder einen externen Server übertragen.</p></div>`}

function updateStatus(){
let el=document.getElementById("classStatus");if(!el)return;
el.innerHTML=`<div class="between"><span><b>${S.studentName||"Noch kein Profil"}</b> · ${S.done.length}/14 Bereiche abgeschlossen</span><span class="pill">${Math.round((S.done.length/14)*100)} %</span></div>`;
}

function render(p){({home,series,curriculum,operator,map,topics,argument,battle,order,language,intro,mainpart,conclusion,practice,writer,review,basics,standard,advanced,transfer,student,teacher,detective,models,challenge,progress,help}[p]||home)(document.getElementById("content"))}
render("home");
</script>
</body>
