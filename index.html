<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutschlabor – Erörterungswerkstatt Klasse 8</title>
<style>
:root{
 --bg:#f7f9fc;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5eaf1;
 --blue:#3b82f6;--blue-soft:#eaf4ff;--yellow:#fff4d6;--green:#e9f8ef;
 --pink:#fff0f3;--purple:#f1efff;--shadow:0 4px 18px rgba(20,40,80,.06)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:278px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;overflow:auto}
.brand{font-size:18px;font-weight:800;padding:7px 16px 24px;color:#111827}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.nav-title{margin:18px 12px 7px;color:#98a2b3;font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.nav button{width:100%;border:0;background:transparent;color:#344054;text-align:left;padding:11px 13px;border-radius:11px;margin:2px 0}
.nav button:hover,.nav button.active{background:var(--blue-soft);color:#175cd3}
.main{margin-left:278px;width:calc(100% - 278px);padding:28px 32px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
h1{font-size:30px;line-height:1.15;margin:0 0 4px;letter-spacing:-.03em}
h2{margin:0 0 10px;letter-spacing:-.02em}h3{margin:0 0 7px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--blue-soft);color:#175cd3;font-size:12px;font-weight:800}
.hero{background:#eaf5ff;border:1px solid #d8ebff;border-radius:20px;padding:27px 30px;margin-bottom:18px}
.hero:before{content:"DEUTSCH · KLASSE 8";display:block;letter-spacing:.18em;font-size:11px;font-weight:800;color:#526173;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow);margin-bottom:15px}
.module{min-height:180px;position:relative}
.module:nth-child(4n+1){background:var(--yellow)}.module:nth-child(4n+2){background:var(--blue-soft)}
.module:nth-child(4n+3){background:var(--green)}.module:nth-child(4n){background:var(--pink)}
.module .num{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff;font-weight:850;margin-bottom:12px}
.module.done{outline:2px solid #86efac}.module.done .num{background:#dcfce7;color:#166534}
.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:800;background:var(--blue);color:#fff}
.btn.secondary{background:#fff;color:#175cd3;border:1px solid #cfe1fa}
.btn.good{background:#16a34a}.btn.ghost{background:#f2f4f7;color:#344054}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:8px;border-radius:99px;background:#e7ecf2;overflow:hidden}
.progress>div{height:100%;background:var(--blue)}
.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:13px;text-align:left}
.choice:hover{border-color:#8ab8f8}
.choice.correct{border-color:#22c55e;background:#f0fdf4}
.choice.wrong{border-color:#ef4444;background:#fef2f2}
.feedback{margin-top:13px;border:1px solid var(--line);background:#f8fafc;border-radius:11px;padding:12px}
.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.warn{background:#fffbeb;border-color:#fde68a}.feedback.bad{background:#fef2f2;border-color:#fecaca}
.quote{border-left:4px solid #8ab8f8;padding:10px 14px;background:#f8fafc;border-radius:0 10px 10px 0}
.step{display:flex;gap:10px;margin:10px 0}.circle{min-width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:#175cd3;display:grid;place-items:center;font-weight:850}
textarea,input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:125px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:15px;align-items:center}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar label{width:185px;font-size:13px}.bar .progress{flex:1}
.tag{display:inline-block;background:#f2f4f7;border-radius:7px;padding:4px 8px;margin:3px;font-size:12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc}
.sort{padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;margin:7px 0;cursor:grab}
.score{font-size:26px;font-weight:850}.hide{display:none!important}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;border-radius:10px;padding:11px 15px;box-shadow:0 10px 30px #0002;z-index:10}
.answer{background:#fffdf3;border:1px solid #f4d77d;border-radius:11px;padding:14px}.answer h3{color:#8a5b00}
.check{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.checkmark{width:25px;height:25px;border-radius:50%;background:var(--blue-soft);color:#175cd3;display:grid;place-items:center;font-weight:850}
.rule{border-left:4px solid #b7d5fb;padding:9px 13px;background:#f8fafc;margin:10px 0}
.small{font-size:13px}.highlight{background:#fff1bf;padding:1px 4px;border-radius:4px}
footer{margin:26px 0;color:var(--muted);font-size:12px}
@media(max-width:820px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;width:100%;padding:18px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav-title{grid-column:1/-1}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">Klasse 8 · Deutsch<small>Erörterungen schreiben</small></div>
<div class="nav">
<div class="nav-title">Orientieren</div>
<button data-page="home">🏠 Start</button><button data-page="curriculum">🎯 RLP-Kompass</button><button data-page="operator">🔎 Operator „erörtern“</button><button data-page="map">🗺️ Lernpfad</button>
<div class="nav-title">Argumentieren lernen</div>
<button data-page="argument">🧩 Argument-Labor</button><button data-page="battle">⚔️ Argument-Battle</button><button data-page="order">🔀 Argumente ordnen</button><button data-page="language">🗣️ Sprachlabor</button>
<div class="nav-title">Erörterung schreiben</div>
<button data-page="intro">🚪 Einleitung</button><button data-page="mainpart">🏗️ Hauptteil</button><button data-page="conclusion">🏁 Schluss</button><button data-page="writer">✍️ Schreibwerkstatt</button><button data-page="review">🔎 Überarbeitungscoach</button>
<div class="nav-title">Klassenmodus</div>
<button data-page="student">👤 Mein Lernstand</button><button data-page="teacher">📊 Lehrkraft</button>
<div class="nav-title">Differenziert üben</div>
<button data-page="basics">🟢 Grundlagen</button><button data-page="standard">🔵 Standard</button><button data-page="advanced">🟣 Herausforderung</button><button data-page="transfer">🚀 Transfer</button>
<div class="nav-title">Üben & sichern</div>
<button data-page="detective">🕵️ Fehlerdetektiv</button><button data-page="models">📖 Musterlösungen</button><button data-page="challenge">🚀 Abschluss-Challenge</button><button data-page="progress">📈 Fortschritt</button><button data-page="help">💡 Lernhilfe</button>
</div></aside>
<main class="main"><div id="content"></div><footer>Deutschlabor · Klasse 8 · lineare Erörterung · Die Plattform unterstützt den Schreibprozess, ersetzt aber nicht das eigene Schreiben.</footer></main>
</div><div id="toast" class="toast hide"></div>

<script>
const defaultState={points:0,done:[],skills:{argument:0,order:0,language:0,structure:0,writing:0},writer:{topic:"Sollte die Schule später beginnen?",position:"",args:["","",""],intro:"",body:"",conclusion:""},ownAttempt:false,modelSeen:false};
let S=JSON.parse(localStorage.getItem("deutschlabor_rlp")||"null")||structuredClone(defaultState);
function save(){localStorage.setItem("deutschlabor_rlp",JSON.stringify(S))}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.remove("hide");setTimeout(()=>e.classList.add("hide"),2200)}
function done(id,pts=10){if(!S.done.includes(id)){S.done.push(id);S.points+=pts;save();toast("Station geschafft! +"+pts+" Punkte")}}
function nav(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));window.scrollTo(0,0);render(p)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.page))
function shell(t,s){return `<div class="top"><div><h1>${t}</h1><div class="muted">${s}</div></div><div class="pill">⭐ ${S.points} Punkte</div></div>`}
const modules=[["argument","1","Argument-Labor","Behauptung, Begründung und Beispiel unterscheiden und verbinden."],["battle","2","Argument-Battle","Qualität von Argumenten vergleichen."],["order","3","Argumente ordnen","Argumente sinnvoll steigern."],["language","4","Sprachlabor","Satzverknüpfungen und sachliche Sprache nutzen."],["intro","5","Einleitung","Thema, Anlass und Fragestellung verbinden."],["mainpart","6","Hauptteil","Argumente entfalten und folgerichtig verbinden."],["conclusion","7","Schluss","Ergebnis, Stellungnahme und Ausblick formulieren."],["writer","8","Schreibwerkstatt","Eine eigene lineare Erörterung schreiben."],["review","9","Überarbeitungscoach","Den eigenen Text anhand von Kriterien überarbeiten."],["challenge","10","Abschluss-Challenge","Selbstständig argumentieren und schreiben."],["basics","A","Grundlagen","Hilfen, Satzbausteine und stark geführte Übungen."],["standard","B","Standard","Selbstständige Aufgaben auf dem Kernniveau."],["advanced","C","Herausforderung","Komplexere Argumentation, Überarbeitung und Transfer."],["transfer","D","Transfer","Neue Themen ohne vorgegebene Lösung bearbeiten."]];

function home(c){let p=Math.round(S.done.length/14*100);c.innerHTML=shell("Erörterungen schreiben","Verstehen. Argumentieren. Überzeugen.");
c.innerHTML+=`<div class="hero"><h2>Erörterungen schreiben</h2><h3>Verstehen. Argumentieren. Überzeugen.</h3><p>Die Lernplattform folgt dem Schreibprozess: <b>verstehen → planen → formulieren → überarbeiten → reflektieren</b>. Spiele helfen beim Üben, aber der Kern ist dein eigener Text.</p><div class="progress"><div style="width:${p}%"></div></div><p class="small">${S.done.length}/14 Lernbereiche abgeschlossen · ${p}%</p><div class="row"><button class="btn" onclick="nav('${S.done.length?modules.find(m=>!S.done.includes(m[0]))?.[0]||'challenge':'operator'}')">${S.done.length?"Weiterlernen":"Starten"} →</button><button class="btn secondary" onclick="nav('curriculum')">Warum diese Inhalte? →</button></div></div>`;
c.innerHTML+=`<div class="grid">${modules.map(m=>`<div class="card module ${S.done.includes(m[0])?'done':''}"><div class="num">${m[1]}</div><h3>${m[2]} ${S.done.includes(m[0])?'✓':''}</h3><p class="muted">${m[3]}</p><button class="btn secondary" onclick="nav('${m[0]}')">${S.done.includes(m[0])?'Wiederholen':'Starten'} →</button></div>`).join("")}</div>`}

function curriculum(c){c.innerHTML=shell("RLP-Kompass","Warum die Lernplattform genau so aufgebaut ist.");
c.innerHTML+=`<div class="card"><h2>Ausgangspunkt: Klasse 8 am Gymnasium</h2><p>Im Fachteil C Deutsch ist für das Gymnasium der Jahrgangsstufe 8 die <b>Niveaustufe F</b> ausgewiesen. Die Plattform verbindet deshalb Grundlagen der Argumentation mit dem zunehmend selbstständigen Planen, Formulieren und Überarbeiten eigener Texte.</p></div>
<div class="card"><h2>Kompetenzabgleich</h2><table class="table"><tr><th>RLP-Schwerpunkt</th><th>Umsetzung in Deutschlabor</th></tr>
<tr><td><b>Erklärend und argumentierend schreiben</b><br>Thesen formulieren, Argumente gewichten, Schlüsse ziehen; Gegenargumente in argumentierende Texte einbeziehen.</td><td>Argument-Labor, Argument-Battle, Ordnen, Hauptteil, Schreibwerkstatt.</td></tr>
<tr><td><b>Adressaten- und zweckgerichtet argumentieren</b></td><td>Schreibaufträge mit klarer Fragestellung und Ziel; sachliche Sprache und Leserführung.</td></tr>
<tr><td><b>Texte überarbeiten</b><br>Kriterien wie Verständlichkeit, Textsorte, Kohärenz, sprachliche Gestaltung und Richtigkeit.</td><td>Überarbeitungscoach, Checklisten, eigene Überarbeitungsschritte.</td></tr>
<tr><td><b>Digitale Schreibwerkzeuge reflektiert nutzen</b></td><td>Der Lerncoach gibt Hinweise und Fragen; er schreibt den Schülertext nicht vor.</td></tr>
<tr><td><b>Sach- und Gebrauchstexte erschließen</b><br>Behauptungen, Argumente und Belege unterscheiden.</td><td>Fehlerdetektiv, Argument-Battle und spätere materialgestützte Erweiterungen.</td></tr>
<tr><td><b>Fachsprache der Niveaustufe F</b></td><td>These, Antithese, Proargument, Kontraargument, Aufhänger, Argumentationsstruktur, Argumentationskette, Stoffsammlung.</td></tr></table></div>
<div class="card"><h2>Wichtig: lineare Erörterung ≠ vollständige Pro-und-Kontra-Erörterung</h2><p>Die bereitgestellten Unterrichtsmaterialien unterscheiden die <b>lineare (steigernde) Erörterung</b> von der dialektischen Pro-und-Kontra-Erörterung. In der linearen Erörterung wird die Fragestellung aus <b>einer Perspektive</b> entfaltet; die Argumente werden steigernd geordnet. Gegenargumente können zur Entkräftung aufgegriffen werden, sind aber nicht der Grundaufbau der Plattform.</p></div>`}

function operator(c){c.innerHTML=shell("Der Operator „erörtern“","Was die Arbeitsanweisung wirklich von dir verlangt.");
c.innerHTML+=`<div class="card"><span class="pill">MERKSATZ</span><h2>Erörtern heißt nicht: „Meine Meinung hinschreiben.“</h2><p><b>Erörtern</b> bedeutet, einen strittigen Sachverhalt bzw. eine Problemfrage <b>gedanklich zu untersuchen, Argumente zu entwickeln, zu ordnen und zu begründen</b> und daraus ein nachvollziehbares Ergebnis zu gewinnen.</p><p>Der Operator verlangt also eine <b>Argumentationsleistung</b>: Du musst zeigen, <i>warum</i> deine Position bzw. dein Ergebnis begründet ist.</p></div>
<div class="card"><h2>Die 6 Schritte des Operators</h2>${[
["1. Fragestellung klären","Was genau soll entschieden oder bewertet werden? Formuliere die Frage in eigenen Worten."],
["2. Position bestimmen","Welche Antwort vertrittst du? Bei der linearen Erörterung entscheidest du dich für eine Perspektive."],
["3. Argumente sammeln","Welche Gründe sprechen für deine Position? Nutze Stoffsammlung, Cluster oder Tabelle."],
["4. Argumente gewichten","Welche Gründe sind eher schwach, welche stark? Ordne sie sinnvoll – bei der linearen Erörterung meist steigernd."],
["5. Argumente entfalten","Jedes zentrale Argument braucht mindestens Behauptung + Begründung + Beispiel/Beleg."],
["6. Ergebnis ziehen","Formuliere am Ende klar, was sich aus deiner Argumentation ergibt."]].map(x=>`<div class="step"><div class="circle">${x[0].split(".")[0]}</div><div><b>${x[0].slice(3)}</b><div class="muted">${x[1]}</div></div></div>`).join("")}</div>
<div class="card"><h2>Was „erörtern“ in dieser Plattform konkret bedeutet</h2><div class="rule"><b>Aufgabe:</b> Erörtere, ob die Schule später beginnen sollte.</div><p><span class="highlight">Nicht ausreichend:</span> „Ich finde, die Schule sollte später beginnen, weil das besser wäre.“</p><p><span class="highlight">Erörternd:</span> Du entwickelst mehrere nachvollziehbare Gründe, erklärst ihre Zusammenhänge, ordnest sie und führst sie zu einem begründeten Ergebnis.</p><p class="small muted">Hinweis: In höheren Jahrgangsstufen kann „erörtern“ je nach Aufgabenstellung ausdrücklich das Abwägen unterschiedlicher Positionen verlangen. Diese Plattform trainiert zunächst die <b>lineare Erörterung</b> nach dem vorliegenden Unterrichtsmaterial.</p></div>
<div class="card"><h2>Anforderungsbereiche</h2><table class="table"><tr><th>AB I</th><th>AB II</th><th>AB III</th></tr><tr><td>Bekanntes wiedergeben, geübte Verfahren anwenden.</td><td>Bekannte Verfahren selbstständig anwenden, ordnen, erklären und übertragen.</td><td>Komplexe Sachverhalte selbstständig bewerten, begründen und zu eigenen Lösungen gelangen.</td></tr></table><p class="small muted">Die Plattform führt von stark angeleiteten Aufgaben zu zunehmend selbstständigem Schreiben.</p></div>`}

function map(c){c.innerHTML=shell("Lernpfad","Jede Station baut auf einer Schreibhandlung auf.");
c.innerHTML+=`<div class="card"><h2>Der Schreibprozess</h2><div class="grid">${modules.map(m=>`<div class="card module ${S.done.includes(m[0])?'done':''}"><div class="num">${m[1]}</div><h3>${m[2]} ${S.done.includes(m[0])?'✓':''}</h3><p class="muted">${m[3]}</p><button class="btn secondary" onclick="nav('${m[0]}')">Öffnen →</button></div>`).join("")}</div></div>`}

let argOrder=[];
function argument(c){argOrder=[];c.innerHTML=shell("Argument-Labor","Ein Argument wird nicht nur behauptet, sondern entfaltet.");
c.innerHTML+=`<div class="card"><h2>Argument-Puzzle</h2><p><b>Thema:</b> Sollte die Schule später beginnen?</p><p>Klicke <b>Behauptung → Begründung → Beispiel</b> an.</p><div class="choicegrid">${[
["B","Ein späterer Schulbeginn könnte die Konzentration verbessern."],["G","Wer ausreichend Schlaf bekommt, kann im Unterricht oft aufmerksamer arbeiten."],["E","Zum Beispiel könnte eine ausgeschlafene Klasse morgens besser bei einer anspruchsvollen Aufgabe mitarbeiten."]
].map((x,i)=>`<button class="choice" onclick="argPick(${i},this)"><b>${x[0]}</b><br>${x[1]}</button>`).join("")}</div><div id="argF"></div></div>`}
function argPick(i,e){let ex=[0,1,2];if(i===ex[argOrder.length]){argOrder.push(i);e.classList.add("correct");if(argOrder.length===3){S.skills.argument=100;done("argument",20);document.getElementById("argF").innerHTML=`<div class="feedback good"><b>Musterlösung:</b> Behauptung → Begründung → Beispiel. Ein Beispiel macht den allgemeinen Gedanken anschaulich.</div>`;save()}}else{e.classList.add("wrong");document.getElementById("argF").innerHTML=`<div class="feedback warn">Überlege: Was ist deine Aussage? Warum gilt sie? Woran könnte man sie konkret erkennen?</div>`}}

let battleRound=0,battleScore=0;const battles=[
["Welche Begründung überzeugt stärker?","„Ein späterer Schulbeginn wäre gut, weil ich morgens keine Lust habe.“","„Ein späterer Schulbeginn könnte sinnvoll sein, weil Jugendliche häufig mehr Schlaf benötigen und dadurch ausgeruhter in den Unterricht starten könnten.“"],
["Welches Beispiel ist konkreter?","„Schule ist manchmal anstrengend.“","„Wenn eine Klasse nach einer kurzen Nacht in der ersten Stunde eine komplexe Aufgabe bearbeiten muss, kann fehlende Konzentration die Arbeit erschweren.“"],
["Welches Argument ist am stärksten entfaltet?","„Projekttage sind gut.“","„Projekttage ermöglichen es, ein Thema über mehrere Stunden praktisch zu untersuchen und dabei Zusammenarbeit zu trainieren.“"]];
function battle(c){let b=battles[battleRound%3];c.innerHTML=shell("Argument-Battle","Vergleiche die Qualität der Argumente – nicht nur deine persönliche Meinung.");
c.innerHTML+=`<div class="card"><span class="pill">Runde ${battleRound%3+1}/3</span><h2>${b[0]}</h2><div class="choicegrid"><button class="choice" onclick="bp(0,this)">${b[1]}</button><button class="choice" onclick="bp(1,this)">${b[2]}</button></div><div id="bf"></div></div>`}
function bp(i,e){if(i===1){e.classList.add("correct");battleScore++;document.getElementById("bf").innerHTML=`<div class="feedback good">Richtig. Das zweite Beispiel ist konkreter bzw. besser begründet.</div>`}else{e.classList.add("wrong");document.getElementById("bf").innerHTML=`<div class="feedback warn">Achte auf die Begründung und den konkreten Nachweis. „Ich finde …“ allein macht ein Argument nicht stark.</div>`}setTimeout(()=>{battleRound++;if(battleRound%3===0){S.skills.argument=Math.max(S.skills.argument,90);done("battle",25);save();}nav("battle")},700)}

function order(c){c.innerHTML=shell("Argumente ordnen","Eine lineare Erörterung steigert die Wirkung ihrer Argumente.");
c.innerHTML+=`<div class="card"><h2>Sortier-Challenge</h2><p>Ordne vom eher allgemeinen zum stärksten Argument.</p><div id="sort">${["Mehr Zeit am Morgen könnte den Schulweg entspannter machen.","Ein späterer Beginn könnte die Konzentration verbessern.","Jugendliche haben häufig einen verschobenen Schlafrhythmus; mehr Schlaf kann deshalb ihre Erholung fördern."].map((x,i)=>`<div class="sort" draggable="true" data-i="${i}">${x}</div>`).join("")}</div><button class="btn" onclick="checkOrder()">Prüfen</button><div id="of"></div></div>`;setTimeout(drag,0)}
function drag(){let box=document.getElementById("sort"),d=null;box.querySelectorAll(".sort").forEach(x=>{x.ondragstart=()=>{d=x;x.classList.add("dragging")};x.ondragend=()=>x.classList.remove("dragging");x.ondragover=e=>{e.preventDefault();if(x!==d){let r=x.getBoundingClientRect();box.insertBefore(d,e.clientY<r.top+r.height/2?x:x.nextSibling)}}})}
function checkOrder(){let ids=[...document.querySelectorAll(".sort")].map(x=>x.dataset.i).join("");let f=document.getElementById("of");if(ids==="012"){S.skills.order=100;done("order",20);f.innerHTML=`<div class="feedback good"><b>Musterlösung:</b> 0 → 1 → 2. Das dritte Argument liefert die stärkste inhaltliche Begründung.</div>`}else f.innerHTML=`<div class="feedback warn">Tipp: Steigere die Überzeugungskraft. Welches Argument erklärt am genauesten, warum die Position sinnvoll ist?</div>`;save()}

function language(c){c.innerHTML=shell("Sprachlabor","Sachlich, abwechslungsreich und logisch verknüpfen.");

function writer(c){let w=S.writer;c.innerHTML=shell("Schreibwerkstatt","Hier entsteht dein eigener Text. Die Plattform darf dich unterstützen, aber nicht für dich schreiben.");
c.innerHTML+=`<div class="card"><span class="pill">SCHRITT 1</span><h2>Aufgabenstellung klären</h2><select id="topic"><option>Sollte die Schule später beginnen?</option><option>Sollten Hausaufgaben reduziert werden?</option><option>Sollten Handys im Unterricht erlaubt sein?</option><option>Sollte es mehr Projekttage geben?</option></select><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="pos('dafür')">Ich bin eher dafür.</button><button class="btn secondary" onclick="pos('dagegen')">Ich bin eher dagegen.</button><span id="position" class="pill">${w.position||"Position auswählen"}</span></div></div>

function pos(p){S.writer.position=p;document.getElementById("position").textContent="Position: "+p;save()}

function review(c){let w=S.writer,txt=[w.intro,w.body,w.conclusion].join(" ");let checks=[
["Aufgabenbezug",!!w.topic&&!!w.position,"Ist die Fragestellung klar beantwortet?"],
["Einleitung",w.intro.trim().length>40,"Führt die Einleitung sachlich zum Thema und zur Fragestellung?"],
["Argumente",w.args.filter(Boolean).length===3,"Sind drei unterschiedliche Argumente geplant?"],
["Argumententfaltung",/weil|da |denn|deshalb|daher/i.test(w.body),"Kannst du bei deinen Argumenten erklären, warum sie gelten?"],
["Beispiel/Beleg",/zum beispiel|beispielsweise|etwa|z\. ?B\./i.test(w.body),"Gibt es ein konkretes Beispiel oder einen nachvollziehbaren Beleg?"],
["Steigerung",w.args.filter(Boolean).length===3,"Sind die Argumente sinnvoll vom schwächeren zum stärkeren geordnet?"],
["Sachlicher Stil",!/mega|voll geil|halt so|echt cool/i.test(txt),"Sind umgangssprachliche Formulierungen vermieden?"],
["Schluss",w.conclusion.trim().length>40,"Wird das Ergebnis zusammengeführt?"]
];c.innerHTML=shell("Überarbeitungscoach","Überarbeiten heißt: Entscheidungen am eigenen Text treffen – nicht einfach Fehler vom Tool korrigieren lassen.");
c.innerHTML+=`<div class="card"><h2>Deine Kriterienliste</h2>${checks.map(x=>`<div class="check"><div class="checkmark">${x[1]?"✓":"!"}</div><div><b>${x[0]}</b><div class="muted">${x[1]?"Erkennbar erfüllt.":"Überarbeite hier: "+x[2]}</div></div></div>`).join("")}</div>
<div class="card"><h2>Überarbeitungsauftrag</h2><p>Wähle <b>einen</b> Schwerpunkt und überarbeite deinen Text selbst:</p><div class="choicegrid"><button class="choice" onclick="focus('Inhalt')">Inhalt: Argumente genauer begründen</button><button class="choice" onclick="focus('Aufbau')">Aufbau: Reihenfolge und Übergänge verbessern</button><button class="choice" onclick="focus('Sprache')">Sprache: sachlicher und abwechslungsreicher formulieren</button><button class="choice" onclick="focus('Richtigkeit')">Richtigkeit: Rechtschreibung und Zeichensetzung prüfen</button></div><div id="rf"></div></div>`}
function focus(x){S.writer.focus=x;save();document.getElementById("rf").innerHTML=`<div class="feedback good"><b>Dein Überarbeitungsschwerpunkt: ${x}</b><br>Ändere jetzt mindestens zwei Stellen in deinem eigenen Text. Begründe anschließend kurz, warum deine Änderungen ihn verbessern.</div>`}

function detective(c){c.innerHTML=shell("Fehlerdetektiv","Analysiere einen schwachen argumentativen Text.");

function showModel(){S.modelSeen=true;save();document.getElementById("model").innerHTML=`<div class="answer"><h3>Musterlösung: lineare Erörterung</h3><p><b>Aufgabe:</b> Erörtere, ob die Schule später beginnen sollte.</p><h4>Einleitung</h4><p>Für viele Jugendliche beginnt der Schultag sehr früh. Gerade während der Pubertät verändert sich der Schlafrhythmus, sodass frühes Aufstehen für manche Schülerinnen und Schüler schwierig sein kann. Deshalb stellt sich die Frage, ob die Schule später beginnen sollte.</p><h4>Hauptteil</h4><p><b>Ein erstes Argument dafür ist, dass ein späterer Schulbeginn den Morgen entspannter machen könnte.</b> Wenn weniger Zeitdruck besteht, können Schülerinnen und Schüler ruhiger in den Tag starten. <b>Zum Beispiel</b> könnte ein späterer Unterrichtsbeginn denjenigen helfen, die einen längeren Schulweg haben.</p><p><b>Ein stärkeres Argument ist die mögliche Verbesserung der Konzentration.</b> Wer ausgeruhter ist, kann Aufgaben häufig aufmerksamer bearbeiten. Das kann besonders in den ersten Unterrichtsstunden wichtig sein, wenn anspruchsvolle Aufgaben anstehen.</p><p><b>Am stärksten wiegt schließlich, dass Jugendliche häufig einen späteren Schlafrhythmus haben.</b> Wenn der Körper abends später müde wird, ist sehr frühes Aufstehen besonders schwierig. Mehr Schlaf könnte deshalb dazu beitragen, dass Jugendliche erholter in den Schultag starten.</p><h4>Schluss</h4><p>Zusammenfassend sprechen mehrere Gründe dafür, den Unterricht später beginnen zu lassen. Besonders überzeugend ist, dass dadurch die Erholung und möglicherweise auch die Konzentration vieler Jugendlicher verbessert werden könnten. Ein späterer Schulbeginn wäre deshalb zumindest eine ernsthaft zu prüfende Möglichkeit.</p><h4>Analysiere die Musterlösung</h4><p><span class="tag">Aufhänger</span><span class="tag">Fragestellung</span><span class="tag">Behauptung</span><span class="tag">Begründung</span><span class="tag">Beispiel</span><span class="tag">Steigerung</span><span class="tag">Fazit</span></p><p class="small"><b>Wichtig:</b> Die Musterlösung ist eine mögliche Lösung, keine einzige „richtige“ Formulierung. Deine eigene Argumentation kann überzeugender sein, wenn sie anders aufgebaut ist.</p></div>`}

function standard(c){

c.innerHTML+=`<div class="card"><span class="pill">LEVEL 2 · ARGUMENTATION</span><h2>1. Welches Argument ist tragfähiger?</h2>
<p><b>Frage:</b> Sollte es weniger Hausaufgaben geben?</p>
<div class="choicegrid"><button class="choice" onclick="std1(0,this)">„Hausaufgaben nerven und ich möchte lieber Freizeit haben.“</button><button class="choice" onclick="std1(1,this)">„Weniger Hausaufgaben könnten sinnvoll sein, wenn die zusätzliche Zeit für Erholung genutzt wird und dadurch die Konzentration am nächsten Schultag steigt.“</button></div><div id="s1"></div></div>
<div class="card"><span class="pill">LEVEL 2 · STOFFSAMMLUNG</span><h2>2. Aus Stichpunkten ein Argument machen</h2>
<p>Stichpunkte: <span class="tag">Projekttage</span><span class="tag">praktisches Arbeiten</span><span class="tag">Zusammenarbeit</span><span class="tag">Ergebnis</span></p>
<p>Formuliere daraus einen eigenen Argumentationsabsatz mit mindestens <b>3 Sätzen</b>.</p>
<textarea id="s2" placeholder="Dein eigener Absatz …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdWrite()">Speichern</button><div id="s2f"></div></div>
<div class="card"><span class="pill">LEVEL 2 · ORDNUNG</span><h2>3. Steigerung begründen</h2>
<p>Du hast drei Argumente. Erkläre in 2–3 eigenen Sätzen, <b>warum</b> das stärkste am Ende stehen sollte.</p>
<textarea id="s3" placeholder="Deine Begründung der Reihenfolge …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdOrder()">Speichern</button><div id="s3f"></div></div>
<div class="card"><span class="pill">LEVEL 2 · EINLEITUNG</span><h2>4. Eigene Einleitung schreiben</h2>
<p>Thema: <b>Sollten Handys im Unterricht teilweise erlaubt sein?</b> Schreibe eine Einleitung mit Hinführung und Fragestellung, ohne schon alle Argumente vorwegzunehmen.</p>
<textarea id="s4" placeholder="Deine Einleitung …"></textarea><button class="btn good" style="margin-top:9px" onclick="stdIntro()">Speichern</button><div id="s4f"></div></div>`}
function std1(i,e){if(i===1){e.classList.add("correct");document.getElementById("s1").innerHTML='<div class="feedback good">Das zweite Argument ist stärker entfaltet: Es nennt nicht nur ein persönliches Bedürfnis, sondern einen nachvollziehbaren Zusammenhang.</div>'}else{e.classList.add("wrong");document.getElementById("s1").innerHTML='<div class="feedback warn">Ein überzeugendes Argument braucht mehr als eine persönliche Vorliebe.</div>'}}
function stdWrite(){let x=document.getElementById("s2").value.trim();if(x.split(/[.!?]+/).filter(Boolean).length>=3){S.ownAttempt=true;S.skills.writing=Math.max(S.skills.writing,40);save();document.getElementById("s2f").innerHTML='<div class="feedback good">Gespeichert. Prüfe jetzt: Behauptung? Begründung? Beispiel oder konkrete Folge?</div>'}else document.getElementById("s2f").innerHTML='<div class="feedback warn">Formuliere mindestens drei vollständige Sätze.</div>'}
function stdOrder(){let x=document.getElementById("s3").value.trim();if(x.length>=50){S.skills.order=Math.max(S.skills.order,70);save();document.getElementById("s3f").innerHTML='<div class="feedback good">Gut. Eine Steigerung ist überzeugend, wenn das stärkste Argument am Ende besonders deutlich wirkt.</div>'}else document.getElementById("s3f").innerHTML='<div class="feedback warn">Begründe deine Entscheidung ausführlicher.</div>'}
function stdIntro(){let x=document.getElementById("s4").value.trim();if(x.length>=60){S.writer.intro=x;S.ownAttempt=true;save();document.getElementById("s4f").innerHTML='<div class="feedback good">Einleitung gespeichert. Überarbeite sie später noch einmal mit dem Kriteriencheck.</div>'}else document.getElementById("s4f").innerHTML='<div class="feedback warn">Schreibe eine vollständige Einleitung mit erkennbarem Themenbezug und Fragestellung.</div>'}

function advanced(c){
c.innerHTML=shell("🟣 Herausforderung","Für Schülerinnen und Schüler, die bereits sicher argumentieren.");
c.innerHTML+=`<div class="card"><span class="pill">LEVEL 3 · DIFFERENZIEREN</span><h2>1. Ein Argument kritisch prüfen</h2>
<div class="quote">„Schuluniformen sollten eingeführt werden, weil dann alle gleich aussehen und es keine Probleme mehr wegen Kleidung gäbe.“</div>
<p>Schreibe 3–5 Sätze: Was ist an diesem Argument überzeugend? Wo ist es zu pauschal? Wie könntest du es präzisieren?</p>
<textarea id="a1" placeholder="Deine Analyse …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv1()">Speichern</button><div id="a1f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · GEGENPOSITION</span><h2>2. Gegenargument aufnehmen, ohne die lineare Struktur zu verlassen</h2>
<p>Formuliere einen Satz, der ein mögliches Gegenargument kurz aufgreift und anschließend entkräftet. Thema: <b>mehr Projekttage</b>.</p>
<textarea id="a2" placeholder="Dein Satz …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv2()">Speichern</button><div id="a2f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · ÜBERARBEITEN</span><h2>3. Schwache Passage verbessern</h2>
<div class="quote">„Ich finde, Projekttage sind gut. Sie machen Spaß. Außerdem kann man da viele Sachen machen. Das ist besser als normaler Unterricht.“</div>
<p>Überarbeite die Passage so, dass ein <b>sachlicher, klar begründeter Argumentationsabsatz</b> entsteht.</p>
<textarea id="a3" placeholder="Deine Überarbeitung …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv3()">Speichern</button><div id="a3f"></div></div>
<div class="card"><span class="pill">LEVEL 3 · REFLEXION</span><h2>4. Was macht ein Argument stark?</h2>
<p>Formuliere deine eigene Definition in 2–4 Sätzen. Verwende mindestens drei Fachbegriffe.</p>
<textarea id="a4" placeholder="Deine Definition …"></textarea><button class="btn good" style="margin-top:9px" onclick="adv4()">Speichern</button><div id="a4f"></div></div>`}
function adv1(){let x=document.getElementById("a1").value.trim();if(x.length>=100){document.getElementById("a1f").innerHTML='<div class="feedback good">Stark. Du prüfst nicht nur, ob du zustimmst, sondern die Qualität der Begründung.</div>'}else document.getElementById("a1f").innerHTML='<div class="feedback warn">Gehe über „ich finde gut/schlecht“ hinaus und nenne mindestens einen konkreten Schwachpunkt.</div>'}
function adv2(){let x=document.getElementById("a2").value.trim();if(x.length>=45){S.skills.argument=Math.max(S.skills.argument,90);save();document.getElementById("a2f").innerHTML='<div class="feedback good">Gut. Ein Gegenargument kann kurz aufgegriffen und anschließend entkräftet werden, ohne die lineare Grundstruktur aufzugeben.</div>'}else document.getElementById("a2f").innerHTML='<div class="feedback warn">Formuliere einen vollständigen Gegenargument-Satz plus Entkräftung.</div>'}
function adv3(){let x=document.getElementById("a3").value.trim();if(x.length>=100){S.ownAttempt=true;save();document.getElementById("a3f").innerHTML='<div class="feedback good">Überarbeitung gespeichert. Vergleiche nun: Sind deine Sätze genauer und sachlicher als die Ausgangsversion?</div>'}else document.getElementById("a3f").innerHTML='<div class="feedback warn">Baue Behauptung, Begründung und ein konkretes Beispiel bzw. eine Folge ein.</div>'}
function adv4(){let x=document.getElementById("a4").value.trim();let n=(x.match(/Behauptung|Begründung|Beispiel|Beleg|These|Argument|Schluss/g)||[]).length;if(x.length>=70&&n>=3){S.skills.argument=100;save();document.getElementById("a4f").innerHTML='<div class="feedback good">Sehr gut. Du kannst nun die Qualität von Argumenten fachsprachlich erklären.</div>'}else document.getElementById("a4f").innerHTML='<div class="feedback warn">Nutze mindestens drei Fachbegriffe und erkläre ihre Funktion.</div>'}

function transfer(c){
c.innerHTML=shell("🚀 Transfer","Neue Themen: keine fertigen Satzbausteine, keine vorgegebene Musterlösung.");
c.innerHTML+=`<div class="card"><span class="pill">LEVEL 4 · SELBSTSTÄNDIG</span><h2>Wähle ein Thema</h2>
<select id="trTopic"><option>Sollten Schulnoten durch andere Formen der Rückmeldung ergänzt werden?</option><option>Sollte die Schule einen verbindlichen Projekttag pro Monat anbieten?</option><option>Sollten Schülerinnen und Schüler mehr Mitspracherecht bei Unterrichtsthemen bekommen?</option><option>Sollten Hausaufgaben am Wochenende vermieden werden?</option></select></div>
<div class="card"><h2>Deine Stoffsammlung</h2><p>Notiere mindestens <b>vier</b> unterschiedliche Gründe und markiere anschließend dein stärkstes Argument.</p>
${[1,2,3,4].map(i=>`<div class="step"><div class="circle">${i}</div><input id="tr${i}" placeholder="Argument ${i}"></div>`).join("")}
<button class="btn good" onclick="transferIdeas()">Stoffsammlung speichern</button><div id="trf"></div></div>
<div class="card"><h2>Deine lineare Mini-Erörterung</h2><p>Schreibe einen vollständigen Text mit Einleitung, mindestens drei Argumenten und Schluss. <b>Mindestens 250 Wörter.</b></p>
<textarea id="trText" style="min-height:260px" placeholder="Dein eigener Text …"></textarea><div class="row" style="margin-top:9px"><button class="btn good" onclick="transferSave()">Text speichern</button><button class="btn secondary" onclick="nav('review')">Mit Kriterien überarbeiten →</button></div><div id="trTextF"></div></div>
<div class="card"><h2>Selbstreflexion</h2><p>Was ist dein stärkstes Argument – und warum? Welche Stelle würdest du beim Überarbeiten zuerst verändern?</p><textarea id="trRef" placeholder="Deine Reflexion …"></textarea><button class="btn good" style="margin-top:9px" onclick="transferRef()">Reflexion speichern</button><div id="trRefF"></div></div>`}
function transferIdeas(){let a=[1,2,3,4].map(i=>document.getElementById("tr"+i).value.trim());if(a.every(x=>x)){S.skills.order=Math.max(S.skills.order,100);save();document.getElementById("trf").innerHTML='<div class="feedback good">Gespeichert. Entscheide jetzt bewusst, welches Argument am stärksten ist und warum es am Ende stehen sollte.</div>'}else document.getElementById("trf").innerHTML='<div class="feedback warn">Fülle alle vier Felder mit unterschiedlichen Gründen aus.</div>'}
function transferSave(){let x=document.getElementById("trText").value.trim();let words=x.split(/\s+/).filter(Boolean).length;if(words>=250){S.ownAttempt=true;S.writer.body=x;S.skills.writing=100;done("transfer",50);save();document.getElementById("trTextF").innerHTML='<div class="feedback good">Dein eigener Transfertext wurde gespeichert. Jetzt überarbeiten statt sofort eine Musterlösung zu suchen.</div>'}else document.getElementById("trTextF").innerHTML=`<div class="feedback warn">Dein Text hat etwa ${words} Wörter. Schreibe mindestens 250 Wörter, damit du eine vollständige Mini-Erörterung entwickelst.</div>`}
function transferRef(){let x=document.getElementById("trRef").value.trim();if(x.length>=80){save();document.getElementById("trRefF").innerHTML='<div class="feedback good">Reflexion gespeichert. Gute Schreibende können nicht nur schreiben, sondern ihre Entscheidungen erklären.</div>'}else document.getElementById("trRefF").innerHTML='<div class="feedback warn">Begründe deine Überlegungen ausführlicher.</div>'}

el.innerHTML=`<div class="between"><span><b>${S.studentName||"Noch kein Profil"}</b> · ${S.done.length}/14 Bereiche abgeschlossen</span><span class="pill">${Math.round((S.done.length/14)*100)} %</span></div>`;
}
